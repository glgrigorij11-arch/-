<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лицей 31 — Школьный Хаб</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center items-center">
    <div id="root" class="w-full max-w-md h-screen sm:h-[850px] sm:rounded-3xl sm:shadow-xl overflow-hidden flex flex-col bg-white border border-slate-200/60 relative"></div>

    <script type="text/babel">
        // Твоя конфигурация Firebase
        const firebaseConfig = { 
            apiKey: "AIzaSyDNaWJbKE6Wvj_gGnNAre5v0PCaxSmVXOo", 
            authDomain: "lyceum31.firebaseapp.com", 
            databaseURL: "https://lyceum31-default-rtdb.firebaseio.com", 
            projectId: "lyceum31", 
            storageBucket: "lyceum31.firebasestorage.app", 
            messagingSenderId: "309039351893", 
            appId: "1:309039351893:web:4f969add85f92325406cdc", 
            measurementId: "G-5KE6VEHLC9" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ⚠️ Впиши сюда свой Telegram username для прав админа
        const ADMIN_USERNAME = "destroyyyx"; 

        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('lost-found');
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authName, setAuthName] = useState('');
            const [authUsername, setAuthUsername] = useState('');
            const [authGrade, setAuthGrade] = useState('9');
            const [authLetter, setAuthLetter] = useState('А');

            const [lostItems, setLostItems] = useState([]);
            const [books, setBooks] = useState([]);
            const [posts, setPosts] = useState([]);

            const [newLostTitle, setNewLostTitle] = useState('');
            const [newLostDesc, setNewLostDesc] = useState('');
            const [newLostImage, setNewLostImage] = useState('');

            const [newBookTitle, setNewBookTitle] = useState('');
            const [newBookAuthor, setNewBookAuthor] = useState('');

            const [newPostText, setNewPostText] = useState('');
            const [newPostImage, setNewPostImage] = useState('');

            // Авторизация через Telegram WebApp
            useEffect(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();

                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        const tgUser = tg.initDataUnsafe.user;
                        const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || tgUser.username || 'Ученик';
                        
                        setCurrentUser({
                            name: fullName,
                            username: tgUser.username || '',
                            tgId: tgUser.id,
                            grade: '9',
                            letter: 'А',
                            avatar: fullName.charAt(0).toUpperCase()
                        });
                    }
                }
            }, []);

            // Синхронизация с Firebase
            useEffect(() => {
                db.ref('lost_items').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ firebaseId: key, ...data[key] }));
                        setLostItems(list.reverse());
                    } else { setLostItems([]); }
                });

                db.ref('books').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ firebaseId: key, ...data[key] }));
                        setBooks(list.reverse());
                    } else { setBooks([]); }
                });

                db.ref('posts').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ firebaseId: key, ...data[key] }));
                        setPosts(list.reverse());
                    } else { setPosts([]); }
                });
            }, []);

            // Автоматическое сжатие изображений > 1.5 МБ
            const handleImageUpload = (e, setImageCallback) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        const MAX_SIZE = 1000;
                        if (width > MAX_SIZE || height > MAX_SIZE) {
                            if (width > height) {
                                height = Math.round((height * MAX_SIZE) / width);
                                width = MAX_SIZE;
                            } else {
                                width = Math.round((width * MAX_SIZE) / height);
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        let quality = 0.8;
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);

                        while (dataUrl.length > 1.5 * 1024 * 1024 && quality > 0.2) {
                            quality -= 0.1;
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                        }

                        setImageCallback(dataUrl);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const openTelegramChat = (username, tgId) => {
                if (username) {
                    window.open(`https://t.me/${username}`, '_blank');
                } else if (tgId) {
                    window.open(`tg://user?id=${tgId}`, '_blank');
                } else {
                    alert("У пользователя не указан username в Telegram");
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!authName.trim()) return;
                const user = {
                    name: authName.trim(),
                    username: authUsername.replace('@', '').trim(),
                    grade: authGrade,
                    letter: authLetter,
                    avatar: authName.trim().charAt(0).toUpperCase()
                };
                setCurrentUser(user);
                setShowAuthModal(false);
            };

            const canDelete = (itemAuthorUsername, itemAuthorTgId) => {
                if (!currentUser) return false;
                const isAdmin = currentUser.username && currentUser.username.toLowerCase() === ADMIN_USERNAME.toLowerCase();
                const isAuthor = (currentUser.username && currentUser.username === itemAuthorUsername) || (currentUser.tgId && currentUser.tgId === itemAuthorTgId);
                return isAdmin || isAuthor;
            };

            const addLostItem = (e) => {
                e.preventDefault();
                if (!newLostTitle.trim() || !currentUser) return;
                
                db.ref('lost_items').push({
                    title: newLostTitle,
                    desc: newLostDesc,
                    imageUrl: newLostImage,
                    author: currentUser.name,
                    authorUsername: currentUser.username,
                    authorTgId: currentUser.tgId,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    date: new Date().toLocaleDateString()
                });

                setNewLostTitle('');
                setNewLostDesc('');
                setNewLostImage('');
            };

            const removeLostItem = (firebaseId) => db.ref(`lost_items/${firebaseId}`).remove();

            const addBook = (e) => {
                e.preventDefault();
                if (!newBookTitle.trim() || !currentUser) return;

                db.ref('books').push({
                    title: newBookTitle,
                    author: newBookAuthor || 'Не указан',
                    holder: currentUser.name,
                    holderUsername: currentUser.username,
                    holderTgId: currentUser.tgId,
                    status: 'Доступна'
                });

                setNewBookTitle('');
                setNewBookAuthor('');
            };

            const removeBook = (firebaseId) => db.ref(`books/${firebaseId}`).remove();

            const addPost = (e) => {
                e.preventDefault();
                if (!newPostText.trim() || !currentUser) return;

                db.ref('posts').push({
                    text: newPostText,
                    imageUrl: newPostImage,
                    author: currentUser.name,
                    authorUsername: currentUser.username,
                    authorTgId: currentUser.tgId,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                setNewPostText('');
                setNewPostImage('');
            };

            const removePost = (firebaseId) => db.ref(`posts/${firebaseId}`).remove();

            return (
                <div className="flex flex-col h-full bg-slate-50 text-slate-800 relative overflow-hidden">
                    
                    {/* Шапка */}
                    <header className="px-4 py-3 bg-white/80 backdrop-blur-md border-b border-slate-200/80 flex items-center justify-between sticky top-0 z-20">
                        <div className="flex items-center space-x-2.5">
                            <div className="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                                31
                            </div>
                            <div>
                                <h1 className="font-bold text-slate-900 text-sm leading-tight">Лицей 31</h1>
                                <p className="text-[10px] text-slate-400 font-medium">Школьный хаб</p>
                            </div>
                        </div>

                        <div>
                            {currentUser ? (
                                <div className="flex items-center space-x-2 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200/60">
                                    <div className="w-5 h-5 rounded-full bg-blue-600 text-white text-[10px] flex items-center font-bold justify-center">
                                        {currentUser.avatar}
                                    </div>
                                    <span className="text-xs font-medium text-slate-700">
                                        {currentUser.username ? `@${currentUser.username}` : currentUser.name}
                                    </span>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setShowAuthModal(true)}
                                    className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3.5 py-1.5 rounded-xl shadow-sm transition">
                                    Войти
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Контент */}
                    <main className="flex-1 p-4 overflow-y-auto space-y-4 pb-24">
                        
                        {/* ПОТЕРЯШКИ */}
                        {activeTab === 'lost-found' && (
                            <div className="space-y-3">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider px-1">Бюро Потеряшек</h2>

                                {currentUser && (
                                    <form onSubmit={addLostItem} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2.5">
                                        <input 
                                            type="text" 
                                            placeholder="Что потерялось или нашлось?" 
                                            value={newLostTitle}
                                            onChange={(e) => setNewLostTitle(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800 placeholder-slate-400"
                                        />
                                        <textarea 
                                            placeholder="Описание, где оставлено..." 
                                            value={newLostDesc}
                                            onChange={(e) => setNewLostDesc(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800 placeholder-slate-400 resize-none h-16"
                                        />
                                        
                                        <div className="flex items-center gap-2 pt-1">
                                            <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-2 rounded-xl font-medium border border-slate-200 transition flex items-center gap-1.5">
                                                📷 Прикрепить фото
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, setNewLostImage)} className="hidden" />
                                            </label>
                                            {newLostImage && <span className="text-[11px] text-emerald-600 font-medium">✓ Фото готово и сжато</span>}
                                        </div>

                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow-sm transition">
                                            Опубликовать
                                        </button>
                                    </form>
                                )}

                                <div className="space-y-2.5">
                                    {lostItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 text-xs">Нет объявлений о потерянных вещах.</div>
                                    ) : (
                                        lostItems.map(item => (
                                            <div key={item.firebaseId} className="bg-white border border-slate-200/80 rounded-2xl p-3.5 shadow-sm space-y-2">
                                                {/* Изображение отображается полностью без обрезки */}
                                                {item.imageUrl && (
                                                    <div className="w-full bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
                                                        <img src={item.imageUrl} alt="Фото" className="w-full h-auto object-contain max-h-[350px]" />
                                                    </div>
                                                )}
                                                <div className="flex justify-between items-start">
                                                    <h3 className="font-semibold text-slate-900 text-xs">{item.title}</h3>
                                                    <span className="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-semibold">{item.classStr}</span>
                                                </div>
                                                {item.desc && <p className="text-xs text-slate-600">{item.desc}</p>}
                                                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                                    <span className="text-[10px] text-slate-400">{item.author}</span>
                                                    <div className="flex gap-1.5">
                                                        <button 
                                                            onClick={() => openTelegramChat(item.authorUsername, item.authorTgId)}
                                                            className="bg-sky-50 text-sky-600 hover:bg-sky-100 text-[11px] px-2.5 py-1 rounded-lg font-medium transition">
                                                            Написать
                                                        </button>
                                                        {canDelete(item.authorUsername, item.authorTgId) && (
                                                            <button 
                                                                onClick={() => removeLostItem(item.firebaseId)}
                                                                className="bg-rose-50 text-rose-600 hover:bg-rose-100 text-[11px] px-2.5 py-1 rounded-lg font-medium transition">
                                                                Удалить
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* БИБЛИОТЕКА */}
                        {activeTab === 'library' && (
                            <div className="space-y-3">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider px-1">Библиотека</h2>
                                {currentUser && (
                                    <form onSubmit={addBook} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2.5">
                                        <input 
                                            type="text" 
                                            placeholder="Название книги" 
                                            value={newBookTitle}
                                            onChange={(e) => setNewBookTitle(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800 placeholder-slate-400"
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="Автор" 
                                            value={newBookAuthor}
                                            onChange={(e) => setNewBookAuthor(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800 placeholder-slate-400"
                                        />
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow-sm transition">
                                            Добавить книгу
                                        </button>
                                    </form>
                                )}
                                <div className="space-y-2.5">
                                    {books.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 text-xs">Библиотека пока пуста.</div>
                                    ) : (
                                        books.map(b => (
                                            <div key={b.firebaseId} className="p-3.5 rounded-2xl border border-slate-200/80 bg-white shadow-sm flex justify-between items-center">
                                                <div>
                                                    <h3 className="font-semibold text-slate-900 text-xs">{b.title}</h3>
                                                    <p className="text-[11px] text-slate-500 mt-0.5">{b.author} • <span className="text-blue-600 font-medium">У: {b.holder}</span></p>
                                                </div>
                                                <div className="flex gap-1.5">
                                                    <button 
                                                        onClick={() => openTelegramChat(b.holderUsername, b.holderTgId)}
                                                        className="bg-sky-50 text-sky-600 text-[11px] px-2.5 py-1.5 rounded-lg font-medium">
                                                        Взять
                                                    </button>
                                                    {canDelete(b.holderUsername, b.holderTgId) && (
                                                        <button 
                                                            onClick={() => removeBook(b.firebaseId)}
                                                            className="bg-rose-50 text-rose-600 text-[11px] px-2.5 py-1.5 rounded-lg font-medium">
                                                            Удалить
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ЛЕНТА */}
                        {activeTab === 'hub' && (
                            <div className="space-y-3">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider px-1">Лента Лицея</h2>
                                {currentUser && (
                                    <form onSubmit={addPost} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2.5">
                                        <textarea 
                                            placeholder="Поделитесь новостью..." 
                                            value={newPostText}
                                            onChange={(e) => setNewPostText(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800 placeholder-slate-400 resize-none h-16"
                                        />
                                        
                                        <div className="flex items-center gap-2 pt-1">
                                            <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-2 rounded-xl font-medium border border-slate-200 transition flex items-center gap-1.5">
                                                📷 Прикрепить фото
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, setNewPostImage)} className="hidden" />
                                            </label>
                                            {newPostImage && <span className="text-[11px] text-emerald-600 font-medium">✓ Фото готово и сжато</span>}
                                        </div>

                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow-sm transition">
                                            Опубликовать пост
                                        </button>
                                    </form>
                                )}
                                <div className="space-y-2.5">
                                    {posts.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 text-xs">Лента новостей пуста.</div>
                                    ) : (
                                        posts.map(p => (
                                            <div key={p.firebaseId} className="bg-white border border-slate-200/80 rounded-2xl p-3.5 shadow-sm space-y-2.5">
                                                <div className="flex justify-between items-center">
                                                    <div className="flex items-center space-x-2">
                                                        <div className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 text-[10px] font-bold flex items-center justify-center">
                                                            {p.author.charAt(0)}
                                                        </div>
                                                        <div>
                                                            <span className="text-xs font-semibold text-slate-900 block leading-none">{p.author}</span>
                                                            <span className="text-[10px] text-slate-400">{p.classStr}</span>
                                                        </div>
                                                    </div>
                                                    <span className="text-[10px] text-slate-400">{p.date}</span>
                                                </div>

                                                <p className="text-xs text-slate-700 leading-relaxed">{p.text}</p>

                                                {/* Изображение отображается полностью без обрезки */}
                                                {p.imageUrl && (
                                                    <div className="w-full bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
                                                        <img src={p.imageUrl} alt="Фото поста" className="w-full h-auto object-contain max-h-[350px]" />
                                                    </div>
                                                )}

                                                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                                    <button 
                                                        onClick={() => openTelegramChat(p.authorUsername, p.authorTgId)}
                                                        className="text-[11px] text-blue-600 font-semibold hover:underline">
                                                        Написать автору
                                                    </button>
                                                    {canDelete(p.authorUsername, p.authorTgId) && (
                                                        <button 
                                                            onClick={() => removePost(p.firebaseId)}
                                                            className="text-[11px] text-rose-500 font-semibold hover:underline">
                                                            Удалить
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Модальное окно авторизации */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl p-5 w-full max-w-xs space-y-3.5 shadow-xl">
                                <h3 className="font-bold text-slate-900 text-center text-sm">Вход в профиль</h3>
                                <form onSubmit={handleLogin} className="space-y-3">
                                    <div>
                                        <label className="text-[11px] text-slate-500 font-medium block mb-1">Имя и фамилия</label>
                                        <input 
                                            type="text" 
                                            placeholder="Иван Иванов" 
                                            value={authName}
                                            onChange={(e) => setAuthName(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-slate-500 font-medium block mb-1">Telegram @username</label>
                                        <input 
                                            type="text" 
                                            placeholder="username" 
                                            value={authUsername}
                                            onChange={(e) => setAuthUsername(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800"
                                        />
                                    </div>
                                    <div className="pt-1 flex gap-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowAuthModal(false)}
                                            className="flex-1 bg-slate-100 text-slate-600 text-xs font-semibold py-2.5 rounded-xl hover:bg-slate-200 transition">
                                            Отмена
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 bg-blue-600 text-white text-xs font-semibold py-2.5 rounded-xl hover:bg-blue-700 transition">
                                            Сохранить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Навигация */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200/80 px-4 py-2.5 flex justify-around z-10 shadow-sm">
                        <button 
                            onClick={() => setActiveTab('lost-found')}
                            className={`flex flex-col items-center text-xs font-semibold transition px-4 py-1 rounded-xl ${activeTab === 'lost-found' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}>
                            <span>Потеряшки</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('library')}
                            className={`flex flex-col items-center text-xs font-semibold transition px-4 py-1 rounded-xl ${activeTab === 'library' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}>
                            <span>Библиотека</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('hub')}
                            className={`flex flex-col items-center text-xs font-semibold transition px-4 py-1 rounded-xl ${activeTab === 'hub' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}>
                            <span>Лента</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
