<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лицей 31 — Школьный Хаб</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        @keyframes macOSSlideIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.985); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
        }

        @keyframes macOSModal {
            0% { opacity: 0; transform: scale(0.92) translateY(16px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes macOSToast {
            0% { opacity: 0; transform: translate(-50%, -16px) scale(0.94); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        .macos-tab-view { animation: macOSSlideIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .macos-modal-anim { animation: macOSModal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .macos-toast-anim { animation: macOSToast 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center items-center selection:bg-blue-500 selection:text-white">
    <div id="root" class="w-full max-w-md h-screen sm:h-[850px] sm:rounded-[36px] sm:shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col relative transition-colors duration-300"></div>

    <script type="text/babel">
        const firebaseConfig = { 
            apiKey: "AIzaSyDNaWJbKE6Wvj_gGnNAre5v0PCaxSmVXOo", 
            authDomain: "lyceum31.firebaseapp.com", 
            databaseURL: "https://lyceum31-default-rtdb.firebaseio.com", 
            projectId: "lyceum31", 
            storageBucket: "lyceum31.firebasestorage.app", 
            messagingSenderId: "309039351893", 
            appId: "1:309039351893:web:4f969add85f92325406cdc", 
            measurementId: "G-5KE6VEHLC9" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const ROOT_ADMIN = "destroyyyx"; 

        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('lost-found');
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('lyceum_dark');
                return saved !== null ? JSON.parse(saved) : true;
            });

            useEffect(() => {
                localStorage.setItem('lyceum_dark', JSON.stringify(darkMode));
            }, [darkMode]);

            const [toastMessage, setToastMessage] = useState(null);

            const showNotification = (text, duration = 2000) => {
                setToastMessage(text);
                setTimeout(() => { setToastMessage(null); }, duration);
            };
            
            const [editingItem, setEditingItem] = useState(null); 
            const [editTitle, setEditTitle] = useState('');
            const [editDesc, setEditDesc] = useState('');
            const [editImage, setEditImage] = useState('');

            const [authName, setAuthName] = useState('');
            const [authUsername, setAuthUsername] = useState('');
            const [authGrade, setAuthGrade] = useState('');
            const [authLetter, setAuthLetter] = useState('');

            const [commentTexts, setCommentTexts] = useState({});
            const [searchQuery, setSearchQuery] = useState('');

            const [lostItems, setLostItems] = useState([]);
            const [posts, setPosts] = useState([]);
            const [bannedUsers, setBannedUsers] = useState({});
            const [adminUsers, setAdminUsers] = useState({});

            const [newLostTitle, setNewLostTitle] = useState('');
            const [newLostDesc, setNewLostDesc] = useState('');
            const [newLostImage, setNewLostImage] = useState('');

            const [newPostText, setNewPostText] = useState('');
            const [newPostImage, setNewPostImage] = useState('');

            const getAvailableLetters = (grade) => {
                if (grade === '10' || grade === '11') return ['А', 'Б', 'В'];
                return ['А', 'Б', 'В', 'Г'];
            };

            useEffect(() => {
                const savedUser = localStorage.getItem('lyceum_user');
                if (savedUser) {
                    setCurrentUser(JSON.parse(savedUser));
                }

                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();

                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        const tgUser = tg.initDataUnsafe.user;
                        const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || tgUser.username || 'Ученик';
                        
                        if (!savedUser) {
                            const defaultUser = {
                                name: fullName,
                                username: tgUser.username ? tgUser.username.toLowerCase() : '',
                                tgId: tgUser.id,
                                grade: '',
                                letter: '',
                                avatar: fullName.charAt(0).toUpperCase()
                            };
                            setCurrentUser(defaultUser);
                            setShowAuthModal(true);
                        }
                    }
                } else if (!savedUser) {
                    setShowAuthModal(true);
                }
            }, []);

            useEffect(() => {
                db.ref('lost_items').on('value', (snapshot) => {
                    const data = snapshot.val();
                    setLostItems(data ? Object.keys(data).map(key => ({ firebaseId: key, ...data[key] })).reverse() : []);
                });

                db.ref('posts').on('value', (snapshot) => {
                    const data = snapshot.val();
                    setPosts(data ? Object.keys(data).map(key => ({ firebaseId: key, ...data[key] })).reverse() : []);
                });

                db.ref('banned_users').on('value', (snapshot) => {
                    setBannedUsers(snapshot.val() || {});
                });

                db.ref('admin_users').on('value', (snapshot) => {
                    setAdminUsers(snapshot.val() || {});
                });
            }, []);

            const isBanned = () => {
                if (!currentUser || !currentUser.username) return false;
                return !!bannedUsers[currentUser.username.toLowerCase()];
            };

            const isAdmin = () => {
                if (!currentUser || !currentUser.username) return false;
                const tag = currentUser.username.toLowerCase();
                return tag === ROOT_ADMIN.toLowerCase() || !!adminUsers[tag];
            };

            const hasClass = () => {
                return currentUser && currentUser.grade && currentUser.letter;
            };

            const addAdmin = (username) => {
                if (!username) return;
                const cleanTag = username.replace('@', '').toLowerCase();
                db.ref(`admin_users/${cleanTag}`).set(true);
                showNotification(`Пользователь @${cleanTag} назначен администратором!`);
            };

            const removeAdmin = (username) => {
                if (username.toLowerCase() === ROOT_ADMIN.toLowerCase()) {
                    showNotification("Нельзя удалить главного администратора!");
                    return;
                }
                db.ref(`admin_users/${username}`).remove();
                showNotification(`Администратор @${username} удален.`);
            };

            const banUserByAdmin = (username) => {
                if (!username) return;
                const cleanTag = username.replace('@', '').toLowerCase();
                if (cleanTag === ROOT_ADMIN.toLowerCase()) { showNotification("Нельзя забанить главного администратора!"); return; }
                db.ref(`banned_users/${cleanTag}`).set(true);
                showNotification(`Пользователь @${cleanTag} забанен.`);
            };

            const unbanUser = (username) => {
                db.ref(`banned_users/${username}`).remove();
                showNotification(`Пользователь @${username} разбанен.`);
            };

            const handleSaveProfile = (e) => {
                e.preventDefault();
                if (!authName.trim() || !authGrade || !authLetter) {
                    showNotification("Заполните все поля, включая класс и букву.");
                    return;
                }
                const cleanTag = authUsername.replace('@', '').trim().toLowerCase();
                const newProfileData = {
                    name: authName.trim(),
                    username: cleanTag,
                    grade: authGrade,
                    letter: authLetter,
                    avatar: authName.trim().charAt(0).toUpperCase(),
                    tgId: currentUser ? currentUser.tgId : Date.now()
                };

                if (!currentUser || !currentUser.grade || isAdmin()) {
                    setCurrentUser(newProfileData);
                    localStorage.setItem('lyceum_user', JSON.stringify(newProfileData));
                    setShowAuthModal(false);
                    setShowProfileModal(false);
                    if (isAdmin() && currentUser && currentUser.grade) {
                        showNotification("Профиль успешно изменен!");
                    }
                    return;
                }

                const requestText = `Здравствуйте! Прошу подтвердить изменение моих данных в Лицейском Хабе:\nИмя: ${newProfileData.name}\nUsername: @${newProfileData.username || 'нет'}\nКласс: ${newProfileData.grade}-${newProfileData.letter}`;
                const encoded = encodeURIComponent(requestText);
                
                window.open(`https://t.me/${ROOT_ADMIN}?text=${encoded}`, '_blank');
                setShowProfileModal(false);
                showNotification("Запрос отправлен администратору в Telegram");
            };

            const canDeleteOrEdit = (itemAuthorUsername, itemAuthorTgId) => {
                if (!currentUser) return false;
                const isAuthor = (currentUser.username && currentUser.username === itemAuthorUsername) || (currentUser.tgId && currentUser.tgId === itemAuthorTgId);
                return isAdmin() || isAuthor;
            };

            const startEditing = (item, type) => {
                setEditingItem({ ...item, type });
                setEditTitle(item.title || item.text || '');
                setEditDesc(item.desc || item.author || '');
                setEditImage(item.imageUrl || '');
            };

            const saveEditedItem = (e) => {
                e.preventDefault();
                if (!editingItem) return;

                if (!editTitle.trim()) {
                    showNotification("⚠️ Заполните название / текст!", 2000);
                    return;
                }

                const { firebaseId, type } = editingItem;
                let updates = {};

                if (type === 'lost') {
                    updates = { title: editTitle, desc: editDesc, imageUrl: editImage };
                    db.ref(`lost_items/${firebaseId}`).update(updates);
                } else if (type === 'post') {
                    updates = { text: editTitle, imageUrl: editImage };
                    db.ref(`posts/${firebaseId}`).update(updates);
                }

                setEditingItem(null);
                showNotification("Запись успешно обновлена!");
            };

            const toggleLostStatus = (firebaseId, currentStatus) => {
                const nextStatus = currentStatus === 'Найдено' ? 'Активно' : 'Найдено';
                db.ref(`lost_items/${firebaseId}`).update({ status: nextStatus });
                showNotification(`Статус изменен на: ${nextStatus}`);
            };

            const togglePinPost = (firebaseId, currentPinned) => {
                db.ref(`posts/${firebaseId}`).update({ isPinned: !currentPinned });
                showNotification(!currentPinned ? "Пост закреплен 📌" : "Пост откреплен");
            };

            const toggleLikePost = (postId, likesObj) => {
                if (!currentUser || !currentUser.username) {
                    showNotification("Нужен username для лайков");
                    return;
                }
                const tag = currentUser.username.toLowerCase();
                const updatedLikes = { ...(likesObj || {}) };
                if (updatedLikes[tag]) {
                    delete updatedLikes[tag];
                } else {
                    updatedLikes[tag] = true;
                }
                db.ref(`posts/${postId}/likes`).set(updatedLikes);
            };

            const openTelegramChat = (username, tgId, itemTitle, itemType) => {
                let defaultText = `Здравствуйте! Пишу по поводу вашего объявления «${itemTitle}» (${itemType}).`;
                const encodedText = encodeURIComponent(defaultText);

                if (username) {
                    window.open(`https://t.me/${username}?text=${encodedText}`, '_blank');
                } else if (tgId) {
                    window.open(`tg://user?id=${tgId}`, '_blank');
                } else {
                    showNotification("У пользователя не указан username в Telegram");
                }
            };

            const handleImageUpload = (e, setImageCallback) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 1000;
                        if (width > MAX_SIZE || height > MAX_SIZE) {
                            if (width > height) {
                                height = Math.round((height * MAX_SIZE) / width);
                                width = MAX_SIZE;
                            } else {
                                width = Math.round((width * MAX_SIZE) / height);
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        let quality = 0.8;
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);
                        while (dataUrl.length > 1.5 * 1024 * 1024 && quality > 0.2) {
                            quality -= 0.1;
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                        }
                        setImageCallback(dataUrl);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const openProfileSettings = () => {
                if (currentUser) {
                    setAuthName(currentUser.name);
                    setAuthUsername(currentUser.username || '');
                    setAuthGrade(currentUser.grade || '');
                    setAuthLetter(currentUser.letter || '');
                }
                setShowProfileModal(true);
            };

            const addLostItem = (e) => {
                e.preventDefault();
                if (!hasClass()) { showNotification("Укажите свой класс в профиле."); setShowProfileModal(true); return; }
                if (isBanned()) { showNotification("Вы забанены."); return; }
                
                if (!newLostTitle.trim()) {
                    showNotification("⚠️ Заполните название вещи!", 2000);
                    return;
                }

                if (!currentUser) return;
                
                db.ref('lost_items').push({
                    title: newLostTitle.trim(),
                    desc: newLostDesc.trim(),
                    imageUrl: newLostImage,
                    author: currentUser.name,
                    authorUsername: currentUser.username,
                    authorTgId: currentUser.tgId,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    status: 'Активно',
                    date: new Date().toLocaleDateString()
                });

                setNewLostTitle('');
                setNewLostDesc('');
                setNewLostImage('');
                showNotification("Объявление опубликовано!");
            };

            const removeLostItem = (firebaseId) => {
                db.ref(`lost_items/${firebaseId}`).remove();
                showNotification("Объявление удалено.");
            };

            const addPost = (e) => {
                e.preventDefault();
                if (!hasClass()) { showNotification("Укажите свой класс в профиле."); setShowProfileModal(true); return; }
                if (isBanned()) { showNotification("Вы забанены."); return; }
                
                if (!newPostText.trim()) {
                    showNotification("⚠️ Заполните текст поста!", 2000);
                    return;
                }

                if (!currentUser) return;

                db.ref('posts').push({
                    text: newPostText.trim(),
                    imageUrl: newPostImage,
                    author: currentUser.name,
                    authorUsername: currentUser.username,
                    authorTgId: currentUser.tgId,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    isPinned: false,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                setNewPostText('');
                setNewPostImage('');
                showNotification("Пост опубликован в ленте!");
            };

            const removePost = (firebaseId) => {
                db.ref(`posts/${firebaseId}`).remove();
                showNotification("Пост удален.");
            };

            const addComment = (postId, e) => {
                e.preventDefault();
                if (!hasClass()) { showNotification("Укажите свой класс в профиле."); setShowProfileModal(true); return; }
                if (isBanned()) { showNotification("Вы забанены."); return; }
                const text = commentTexts[postId];
                if (!text || !text.trim()) return;

                db.ref(`posts/${postId}/comments`).push({
                    text: text.trim(),
                    author: currentUser.name,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                setCommentTexts({ ...commentTexts, [postId]: '' });
            };

            const removeComment = (postId, commentId) => {
                db.ref(`posts/${postId}/comments/${commentId}`).remove();
            };

            const filteredLostItems = lostItems.filter(item => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return (item.title && item.title.toLowerCase().includes(q)) ||
                       (item.desc && item.desc.toLowerCase().includes(q)) ||
                       (item.classStr && item.classStr.toLowerCase().includes(q));
            });

            const filteredPosts = posts.slice().sort((a, b) => {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                return 0;
            }).filter(p => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return (p.text && p.text.toLowerCase().includes(q)) ||
                       (p.author && p.author.toLowerCase().includes(q)) ||
                       (p.classStr && p.classStr.toLowerCase().includes(q));
            });

            // Убран градиент из светлой темы, теперь чистый фон
            const themeClass = darkMode ? "bg-slate-900 text-slate-100" : "bg-slate-50 text-slate-800";
            const headerClass = darkMode ? "bg-slate-900/80 border-slate-800 text-white" : "bg-white/80 border-slate-200/80 text-slate-900";
            const cardClass = darkMode ? "bg-slate-800/80 border-slate-700/60 shadow-lg text-slate-100" : "bg-white/90 border-slate-200/70 shadow-[0_10px_25px_-5px_rgba(0,0,0,0.03)] text-slate-800";
            const inputClass = darkMode ? "bg-slate-900 border-slate-700 text-white placeholder-slate-500" : "bg-slate-50 border-slate-200/80 text-slate-800 placeholder-slate-400";
            const navClass = darkMode ? "bg-slate-900/85 border-slate-800" : "bg-white/80 border-slate-200/60";

            return (
                <div className={`flex flex-col h-full relative overflow-hidden transition-colors duration-300 ${themeClass}`}>
                    
                    {/* Кастомное уведомление (Тост) */}
                    {toastMessage && (
                        <div className="absolute top-16 left-1/2 macos-toast-anim z-50 bg-slate-900/95 backdrop-blur-xl text-white text-xs px-4 py-3 rounded-2xl shadow-[0_15px_30px_rgba(0,0,0,0.3)] border border-white/15 flex items-center space-x-2.5">
                            <span className="text-blue-400">✦</span>
                            <span className="font-medium tracking-wide">{toastMessage}</span>
                        </div>
                    )}

                    {/* Шапка */}
                    <header className={`px-4 py-3.5 backdrop-blur-xl border-b flex items-center justify-between sticky top-0 z-20 transition-colors duration-300 ${headerClass}`}>
                        <div className="flex items-center space-x-3">
                            <div className="w-9 h-9 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-[0_8px_16px_rgba(37,99,235,0.3)]">
                                31
                            </div>
                            <div>
                                <h1 className="font-bold text-sm tracking-tight leading-none">Лицей 31</h1>
                                <p className="text-[10px] text-blue-500 font-semibold tracking-wide uppercase mt-0.5">Школьный хаб</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-1.5">
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className={`w-8 h-8 rounded-xl flex items-center justify-center border text-xs transition ${darkMode ? 'bg-slate-800 border-slate-700 text-amber-400' : 'bg-slate-100 border-slate-200 text-slate-600'}`}
                                title="Сменить тему">
                                {darkMode ? '🌙' : '☀️'}
                            </button>

                            {isAdmin() && (
                                <button 
                                    onClick={() => setActiveTab('admin-panel')}
                                    className={`text-xs font-semibold px-3 py-1.5 rounded-xl border transition-all duration-300 ${activeTab === 'admin-panel' ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white border-transparent shadow-[0_4px_12px_rgba(37,99,235,0.3)]' : 'bg-blue-500/10 text-blue-400 border-blue-500/20 hover:bg-blue-500/20'}`}>
                                    🛡️ Админка
                                </button>
                            )}

                            {currentUser ? (
                                <button 
                                    onClick={openProfileSettings}
                                    className={`flex items-center space-x-2 px-3 py-1.5 rounded-full border transition-all shadow-sm ${darkMode ? 'bg-slate-800 border-slate-700 hover:bg-slate-700' : 'bg-slate-100/80 border-slate-200/80 hover:bg-slate-200'}`}>
                                    <div className="w-5 h-5 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 text-white text-[10px] flex items-center font-bold justify-center shadow-sm">
                                        {currentUser.avatar}
                                    </div>
                                    <span className="text-xs font-semibold tracking-tight">
                                        {hasClass() ? `${currentUser.grade}-${currentUser.letter}` : 'Нет класса'}
                                    </span>
                                </button>
                            ) : (
                                <button 
                                    onClick={() => { setAuthName(''); setAuthUsername(''); setShowAuthModal(true); }}
                                    className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-[0_4px_12px_rgba(37,99,235,0.25)] transition-all">
                                    Войти
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Бан-баннер */}
                    {isBanned() && (
                        <div className="bg-gradient-to-r from-rose-500 to-red-600 text-white text-xs py-2 px-4 text-center font-semibold shadow-sm">
                            ⚠️ Ваш аккаунт заблокирован администратором. Публикация записей ограничена.
                        </div>
                    )}

                    {/* Предупреждение о невыбранном классе */}
                    {currentUser && !hasClass() && (
                        <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white text-xs py-2.5 px-4 text-center font-semibold flex justify-between items-center shadow-sm">
                            <span>⚠️ Укажите класс в профиле для доступа к функциям.</span>
                            <button onClick={openProfileSettings} className="bg-white text-amber-600 px-3 py-1 rounded-lg text-[11px] font-bold shadow-sm hover:bg-amber-50 transition">Указать</button>
                        </div>
                    )}

                    {/* Контент */}
                    <main className="flex-1 p-4 overflow-y-auto space-y-4 pb-28">
                        
                        {(activeTab === 'lost-found' || activeTab === 'hub') && (
                            <div className="relative">
                                <input 
                                    type="text"

                                            value={authName}
                                            onChange={(e) => setAuthName(e.target.value)}
                                            className={`w-full text-xs p-3 rounded-xl border focus:outline-none focus:border-blue-500 transition ${inputClass}`}
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-slate-400 font-semibold block mb-1">Telegram @username</label>
                                        <input 
                                            type="text" 
                                            placeholder="username" 
                                            value={authUsername}
                                            onChange={(e) => setAuthUsername(e.target.value)}
                                            className={`w-full text-xs p-3 rounded-xl border focus:outline-none focus:border-blue-500 transition ${inputClass}`}
                                        />
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <label className="text-[11px] text-slate-400 font-semibold block mb-1">Параллель</label>
                                            <select 
                                                value={authGrade} 
                                                onChange={(e) => {
                                                    const newGrade = e.target.value;
                                                    setAuthGrade(newGrade);
                                                    const allowedLetters = getAvailableLetters(newGrade);
                                                    if (!allowedLetters.includes(authLetter)) {
                                                        setAuthLetter(allowedLetters[0]);
                                                    }
                                                }}
                                                className={`w-full text-xs p-3 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} required>
                                                <option value="">Выберите</option>
                                                <option value="5">5</option>
                                                <option value="6">6</option>
                                                <option value="7">7</option>
                                                <option value="8">8</option>
                                                <option value="9">9</option>
                                                <option value="10">10</option>
                                                <option value="11">11</option>
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-[11px] text-slate-400 font-semibold block mb-1">Буква</label>
                                            <select 
                                                value={authLetter} 
                                                onChange={(e) => setAuthLetter(e.target.value)}
                                                className={`w-full text-xs p-3 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} required>
                                                <option value="">-</option>
                                                {getAvailableLetters(authGrade).map(l => (
                                                    <option key={l} value={l}>{l}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-2">
                                        <button 
                                            type="submit" 
                                            className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-semibold py-3 rounded-xl hover:from-blue-700 hover:to-indigo-700 transition shadow-[0_4px_15px_rgba(37,99,235,0.3)]">
                                            Продолжить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Модальное окно профиля */}
                    {showProfileModal && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className={`border rounded-[32px] p-6 w-full max-w-xs space-y-4 shadow-2xl macos-modal-anim ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200'}`}>
                                <h3 className="font-bold text-center text-sm">Настройки профиля</h3>
                                <p className="text-[10px] text-slate-400 text-center leading-relaxed">
                                    {isAdmin() ? "Изменение данных (Админ)" : "Изменение сформирует запрос администратору (@" + ROOT_ADMIN + ")"}
                                </p>
                                <form onSubmit={handleSaveProfile} className="space-y-3">
                                    <div>
                                        <label className="text-[11px] text-slate-400 font-semibold block mb-1">Имя и фамилия</label>
                                        <input 
                                            type="text" 
                                            value={authName}
                                            onChange={(e) => setAuthName(e.target.value)}
                                            className={`w-full text-xs p-3 rounded-xl border focus:outline-none focus:border-blue-500 transition ${inputClass}`}
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-slate-400 font-semibold block mb-1">Telegram @username</label>
                                        <input 
                                            type="text" 
                                            value={authUsername}
                                            onChange={(e) => setAuthUsername(e.target.value)}
                                            className={`w-full text-xs p-3 rounded-xl border focus:outline-none focus:border-blue-500 transition ${inputClass}`}
                                        />
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <label className="text-[11px] text-slate-400 font-semibold block mb-1">Параллель</label>
                                            <select 
                                                value={authGrade} 
                                                onChange={(e) => {
                                                    const newGrade = e.target.value;
                                                    setAuthGrade(newGrade);
                                                    const allowedLetters = getAvailableLetters(newGrade);
                                                    if (!allowedLetters.includes(authLetter)) {
                                                        setAuthLetter(allowedLetters[0]);
                                                    }
                                                }}
                                                className={`w-full text-xs p-3 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} required>
                                                <option value="5">5</option>
                                                <option value="6">6</option>
                                                <option value="7">7</option>
                                                <option value="8">8</option>
                                                <option value="9">9</option>
                                                <option value="10">10</option>
                                                <option value="11">11</option>
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-[11px] text-slate-400 font-semibold block mb-1">Буква</label>
                                            <select 
                                                value={authLetter} 
                                                onChange={(e) => setAuthLetter(e.target.value)}
                                                className={`w-full text-xs p-3 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} required>
                                                {getAvailableLetters(authGrade).map(l => (
                                                    <option key={l} value={l}>{l}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-2 flex gap-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowProfileModal(false)}
                                            className={`flex-1 text-xs font-semibold py-3 rounded-xl transition ${darkMode ? 'bg-slate-800 hover:bg-slate-700 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                                            Отмена
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-semibold py-3 rounded-xl hover:from-blue-700 hover:to-indigo-700 transition shadow-[0_4px_12px_rgba(37,99,235,0.3)]">
                                            {isAdmin() ? "Сохранить" : "Запросить"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Навигация */}
                    <nav className={`absolute bottom-0 left-0 right-0 backdrop-blur-xl border-t px-6 py-3 flex justify-around z-10 shadow-[0_-10px_30px_rgba(0,0,0,0.03)] transition-colors duration-300 ${navClass}`}>
                        <button 
                            onClick={() => setActiveTab('lost-found')}
                            className={`flex flex-col items-center text-xs font-semibold transition-all duration-300 px-5 py-1.5 rounded-2xl ${activeTab === 'lost-found' ? 'text-blue-400 bg-blue-500/10 shadow-[0_4px_12px_rgba(37,99,235,0.12)] scale-105' : 'text-slate-400 hover:text-slate-200'}`}>
                            <span>Потеряшки</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('library')}
                            className={`flex flex-col items-center text-xs font-semibold transition-all duration-300 px-5 py-1.5 rounded-2xl ${activeTab === 'library' ? 'text-blue-400 bg-blue-500/10 shadow-[0_4px_12px_rgba(37,99,235,0.12)] scale-105' : 'text-slate-400 hover:text-slate-200'}`}>
                            <span>Библиотека</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('hub')}
                            className={`flex flex-col items-center text-xs font-semibold transition-all duration-300 px-5 py-1.5 rounded-2xl ${activeTab === 'hub' ? 'text-blue-400 bg-blue-500/10 shadow-[0_4px_12px_rgba(37,99,235,0.12)] scale-105' : 'text-slate-400 hover:text-slate-200'}`}>
                            <span>Лента</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
