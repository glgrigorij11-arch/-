<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лицей 31 — Школьный Хаб</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        @keyframes appleTabTransition {
            0% { opacity: 0; transform: translateY(8px) scale(0.99); filter: blur(3px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
        }

        @keyframes appleModalAnim {
            0% { opacity: 0; transform: scale(0.94) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes appleToastAnim {
            0% { opacity: 0; transform: translate(-50%, -12px) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        .apple-tab-view { animation: appleTabTransition 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .apple-modal-anim { animation: appleModalAnim 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .apple-toast-anim { animation: appleToastAnim 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center items-center selection:bg-blue-500 selection:text-white">
    <div id="root" class="w-full max-w-md h-screen sm:h-[850px] sm:rounded-[36px] sm:shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col relative transition-colors duration-300"></div>

    <script type="text/babel">
        const FIREBASE_URL = "https://lyceum31-default-rtdb.firebaseio.com";

        const firebaseConfig = { 
            apiKey: "AIzaSyDNaWJbKE6Wvj_gGnNAre5v0PCaxSmVXOo", 
            authDomain: "lyceum31.firebaseapp.com", 
            databaseURL: FIREBASE_URL, 
            projectId: "lyceum31", 
            storageBucket: "lyceum31.firebasestorage.app", 
            messagingSenderId: "309039351893", 
            appId: "1:309039351893:web:4f969add85f92325406cdc", 
            measurementId: "G-5KE6VEHLC9" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const ROOT_ADMIN = "destroyyyx"; 

        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('lost-found');
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('lyceum_dark');
                return saved !== null ? JSON.parse(saved) : true;
            });

            useEffect(() => {
                localStorage.setItem('lyceum_dark', JSON.stringify(darkMode));
            }, [darkMode]);

            const [toastMessage, setToastMessage] = useState(null);

            const showNotification = (text, duration = 2000) => {
                setToastMessage(text);
                setTimeout(() => { setToastMessage(null); }, duration);
            };

            const [authFirstName, setAuthFirstName] = useState('');
            const [authLastName, setAuthLastName] = useState('');
            const [authUsername, setAuthUsername] = useState('');
            const [authGrade, setAuthGrade] = useState('');
            const [authLetter, setAuthLetter] = useState('');

            const [newAdminInput, setNewAdminInput] = useState('');
            const [commentTexts, setCommentTexts] = useState({});
            const [searchQuery, setSearchQuery] = useState('');

            const [lostItems, setLostItems] = useState([]);
            const [posts, setPosts] = useState([]);
            const [bannedUsers, setBannedUsers] = useState({});
            const [adminUsers, setAdminUsers] = useState({});

            const [newLostTitle, setNewLostTitle] = useState('');
            const [newLostDesc, setNewLostDesc] = useState('');
            const [newLostImage, setNewLostImage] = useState('');

            const [newPostText, setNewPostText] = useState('');
            const [newPostImage, setNewPostImage] = useState('');

            const getAvailableLetters = (grade) => {
                if (grade === '10' || grade === '11') return ['А', 'Б', 'В'];
                return ['А', 'Б', 'В', 'Г'];
            };

            useEffect(() => {
                const savedUser = localStorage.getItem('lyceum_user');
                if (savedUser) {
                    try { setCurrentUser(JSON.parse(savedUser)); } catch(e){}
                }

                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();

                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        const tgUser = tg.initDataUnsafe.user;
                        if (!savedUser) {
                            const defaultUser = {
                                firstName: '',
                                lastName: '',
                                username: tgUser.username ? tgUser.username.toLowerCase() : '',
                                tgId: tgUser.id,
                                grade: '',
                                letter: '',
                                avatar: (tgUser.username || 'У').charAt(0).toUpperCase()
                            };
                            setCurrentUser(defaultUser);
                            setShowAuthModal(true);
                        }
                    }
                } else if (!savedUser) {
                    setShowAuthModal(true);
                }
            }, []);

            useEffect(() => {
                db.ref('lost_items').on('value', (snapshot) => {
                    const data = snapshot.val();
                    setLostItems(data ? Object.keys(data).map(key => ({ firebaseId: key, ...data[key] })).reverse() : []);
                });

                db.ref('posts').on('value', (snapshot) => {
                    const data = snapshot.val();
                    setPosts(data ? Object.keys(data).map(key => ({ firebaseId: key, ...data[key] })).reverse() : []);
                });

                db.ref('banned_users').on('value', (snapshot) => {
                    setBannedUsers(snapshot.val() || {});
                });

                db.ref('admin_users').on('value', (snapshot) => {
                    setAdminUsers(snapshot.val() || {});
                });
            }, []);

            const isBanned = () => {
                if (!currentUser || !currentUser.username) return false;
                return !!bannedUsers[currentUser.username.toLowerCase()];
            };

            const isAdmin = () => {
                if (!currentUser || !currentUser.username) return false;
                const tag = currentUser.username.toLowerCase();
                return tag === ROOT_ADMIN.toLowerCase() || !!adminUsers[tag];
            };

            const hasClass = () => {
                return currentUser && currentUser.grade && currentUser.letter;
            };

            const isFullyRegistered = () => {
                return currentUser && currentUser.firstName && currentUser.firstName.trim() && currentUser.lastName && currentUser.lastName.trim() && hasClass();
            };

            const checkRegistrationOrPrompt = () => {
                if (!isFullyRegistered()) {
                    showNotification("⚠️ Заполните Имя и Фамилию для выполнения действий!");
                    if (currentUser) {
                        setAuthFirstName(currentUser.firstName || '');
                        setAuthLastName(currentUser.lastName || '');
                        setAuthUsername(currentUser.username || '');
                        setAuthGrade(currentUser.grade || '');
                        setAuthLetter(currentUser.letter || '');
                    }
                    setShowProfileModal(true);
                    return false;
                }
                return true;
            };

            const addAdminByUsername = (e) => {
                e.preventDefault();
                if (!newAdminInput.trim()) return;
                const cleanTag = newAdminInput.replace('@', '').trim().toLowerCase();
                db.ref(`admin_users/${cleanTag}`).set(true);
                setNewAdminInput('');
                showNotification(`Администратор @${cleanTag} успешно добавлен!`);
            };

            const removeAdmin = (username) => {
                if (username.toLowerCase() === ROOT_ADMIN.toLowerCase()) {
                    showNotification("Нельзя удалить главного администратора!");
                    return;
                }
                db.ref(`admin_users/${username}`).remove();
                showNotification(`Администратор @${username} удален.`);
            };

            const banUserByAdmin = (username) => {
                if (!username) return;
                const cleanTag = username.replace('@', '').toLowerCase();
                if (cleanTag === ROOT_ADMIN.toLowerCase()) { showNotification("Нельзя забанить главного администратора!"); return; }
                db.ref(`banned_users/${cleanTag}`).set(true);
                showNotification(`Пользователь @${cleanTag} забанен.`);
            };

            const unbanUser = (username) => {
                db.ref(`banned_users/${username}`).remove();
                showNotification(`Пользователь @${username} разбанен.`);
            };

            const handleSaveProfile = (e) => {
                e.preventDefault();
                const cleanTag = authUsername.replace('@', '').trim().toLowerCase();
                if (!cleanTag) {
                    showNotification("Укажите Telegram @username.");
                    return;
                }
                if (!authGrade || !authLetter) {
                    showNotification("Выберите класс и параллель.");
                    return;
                }

                const newProfileData = {
                    firstName: authFirstName.trim(),
                    lastName: authLastName.trim(),
                    username: cleanTag,
                    grade: authGrade,
                    letter: authLetter,
                    avatar: (authFirstName || cleanTag || 'У').charAt(0).toUpperCase(),
                    tgId: currentUser ? currentUser.tgId : Date.now()
                };

                if (!currentUser || !currentUser.username || !currentUser.grade || isAdmin()) {
                    setCurrentUser(newProfileData);
                    localStorage.setItem('lyceum_user', JSON.stringify(newProfileData));
                    setShowAuthModal(false);
                    setShowProfileModal(false);
                    showNotification("Профиль сохранен!");
                    return;
                }

                const requestText = `Здравствуйте! Прошу подтвердить изменение моих данных в Лицейском Хабе:\nИмя: ${newProfileData.firstName} ${newProfileData.lastName}\nUsername: @${newProfileData.username}\nКласс: ${newProfileData.grade}-${newProfileData.letter}`;
                const encoded = encodeURIComponent(requestText);
                
                window.open(`https://t.me/${ROOT_ADMIN}?text=${encoded}`, '_blank');
                setShowProfileModal(false);
                showNotification("Запрос отправлен администратору в Telegram");
            };

            const canDeleteOrEdit = (itemAuthorUsername, itemAuthorTgId) => {
                if (!currentUser) return false;
                const isAuthor = (currentUser.username && currentUser.username === itemAuthorUsername) || (currentUser.tgId && currentUser.tgId === itemAuthorTgId);
                return isAdmin() || isAuthor;
            };

            const toggleLostStatus = (firebaseId, currentStatus) => {
                if (!checkRegistrationOrPrompt()) return;
                const nextStatus = currentStatus === 'Найдено' ? 'Активно' : 'Найдено';
                db.ref(`lost_items/${firebaseId}`).update({ status: nextStatus });
            };

            const togglePinPost = (firebaseId, currentPinned) => {
                if (!isAdmin()) return;
                db.ref(`posts/${firebaseId}`).update({ isPinned: !currentPinned });
            };

            const toggleLikePost = (postId, likesObj) => {
                if (!checkRegistrationOrPrompt()) return;
                const tag = currentUser.username.toLowerCase();
                const updatedLikes = { ...(likesObj || {}) };
                if (updatedLikes[tag]) { delete updatedLikes[tag]; } else { updatedLikes[tag] = true; }
                db.ref(`posts/${postId}/likes`).set(updatedLikes);
            };

            const openTelegramChat = (username, tgId, itemTitle, itemType) => {
                if (!checkRegistrationOrPrompt()) return;
                let defaultText = `Здравствуйте! Пишу по поводу «${itemTitle}» (${itemType}).`;
                if (username) {
                    window.open(`https://t.me/${username}?text=${encodeURIComponent(defaultText)}`, '_blank');
                } else if (tgId) {
                    window.open(`tg://user?id=${tgId}`, '_blank');
                } else {
                    showNotification("Нет username");
                }
            };

            const handleImageUpload = (e, setImageCallback) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const MAX = 800;
                        if (w > MAX || h > MAX) {
                            if (w > h) { h = Math.round((h * MAX) / w); w = MAX; }
                            else { w = Math.round((w * MAX) / h); h = MAX; }
                        }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        setImageCallback(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const addLostItem = () => {
                if (!checkRegistrationOrPrompt()) return;
                if (isBanned()) { showNotification("Вы забанены."); return; }
                if (!newLostTitle.trim()) { showNotification("⚠️ Заполните название!"); return; }

                const displayName = `${currentUser.firstName} ${currentUser.lastName}`;

                const newItem = {
                    title: newLostTitle.trim(),
                    desc: newLostDesc.trim(),
                    imageUrl: newLostImage,
                    author: displayName,
                    authorUsername: currentUser.username || '',
                    authorTgId: currentUser.tgId || '',
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    status: 'Активно',
                    date: new Date().toLocaleDateString()
                };

                fetch(`${FIREBASE_URL}/lost_items.json`, {
                    method: 'POST',
                    body: JSON.stringify(newItem)
                }).then(() => {
                    setNewLostTitle('');
                    setNewLostDesc('');
                    setNewLostImage('');
                    showNotification("Успешно опубликовано! 🎉");
                }).catch(() => {
                    showNotification("Ошибка публикации");
                });
            };

            const addPost = () => {
                if (!checkRegistrationOrPrompt()) return;
                if (isBanned()) { showNotification("Вы забанены."); return; }
                if (!newPostText.trim()) { showNotification("⚠️ Заполните текст!"); return; }

                const displayName = `${currentUser.firstName} ${currentUser.lastName}`;

                const newPostData = {
                    text: newPostText.trim(),
                    imageUrl: newPostImage,
                    author: displayName,
                    authorUsername: currentUser.username || '',
                    authorTgId: currentUser.tgId || '',
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    isPinned: false,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                fetch(`${FIREBASE_URL}/posts.json`, {
                    method: 'POST',
                    body: JSON.stringify(newPostData)
                }).then(() => {
                    setNewPostText('');
                    setNewPostImage('');
                    showNotification("Пост опубликован! 🎉");
                }).catch(() => {
                    showNotification("Ошибка публикации");
                });
            };

            const addComment = (postId, e) => {
                e.preventDefault();
                if (!checkRegistrationOrPrompt()) return;
                if (isBanned()) { showNotification("Вы забанены."); return; }
                const text = commentTexts[postId];
                if (!text || !text.trim()) return;

                const displayName = `${currentUser.firstName} ${currentUser.lastName}`;

                db.ref(`posts/${postId}/comments`).push({
                    text: text.trim(),
                    author: displayName,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                setCommentTexts({ ...commentTexts, [postId]: '' });
            };

            const removeComment = (postId, commentId) => {
                db.ref(`posts/${postId}/comments/${commentId}`).remove();
            };

            const filteredLostItems = lostItems.filter(item => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return (item.title && item.title.toLowerCase().includes(q)) ||
                       (item.desc && item.desc.toLowerCase().includes(q)) ||
                       (item.classStr && item.classStr.toLowerCase().includes(q));
            });

            const filteredPosts = posts.slice().sort((a, b) => {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                return 0;
            }).filter(p => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return (p.text && p.text.toLowerCase().includes(q)) ||
                       (p.author && p.author.toLowerCase().includes(q)) ||
                       (p.classStr && p.classStr.toLowerCase().includes(q));
            });

            const themeClass = darkMode ? "bg-slate-900 text-slate-100" : "bg-slate-50 text-slate-800";
            const headerClass = darkMode ? "bg-slate-900/80 border-slate-800 text-white" : "bg-white/80 border-slate-200/80 text-slate-900";
            const cardClass = darkMode ? "bg-slate-800/80 border-slate-700/60 shadow-lg text-slate-100" : "bg-white/90 border-slate-200/70 shadow-sm text-slate-800";
            const inputClass = darkMode ? "bg-slate-900 border-slate-700 text-white placeholder-slate-500" : "bg-slate-50 border-slate-200 text-slate-800 placeholder-slate-400";
            const navClass = darkMode ? "bg-slate-900/85 border-slate-800" : "bg-white/80 border-slate-200";

            return (
                <div className={`flex flex-col h-full relative overflow-hidden transition-colors duration-300 ${themeClass}`}>
                    
                    {toastMessage && (
                        <div className="absolute top-16 left-1/2 apple-toast-anim z-50 bg-slate-900/95 backdrop-blur-xl text-white text-xs px-4 py-3 rounded-2xl shadow-xl border border-white/15 flex items-center space-x-2.5 max-w-[90%] text-center">
                            <span className="text-blue-400">✦</span>
                            <span className="font-medium">{toastMessage}</span>
                        </div>
                    )}

                    <header className={`px-4 py-3.5 backdrop-blur-xl border-b flex items-center justify-between sticky top-0 z-20 ${headerClass}`}>
                        <div className="flex items-center space-x-3">
                            <div className="w-9 h-9 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md">
                                31
                            </div>
                            <div>
                                <h1 className="font-bold text-sm tracking-tight leading-none">Лицей 31</h1>
                                <p className="text-[10px] text-blue-500 font-semibold uppercase mt-0.5">Школьный хаб</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-1.5">
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className={`w-8 h-8 rounded-xl flex items-center justify-center border text-xs ${darkMode ? 'bg-slate-800 border-slate-700 text-amber-400' : 'bg-slate-100 border-slate-200 text-slate-600'}`}>
                                {darkMode ? '🌙' : '☀️'}
                            </button>

                            {isAdmin() && (
                                <button 
                                    onClick={() => setActiveTab('admin-panel')}
                                    className={`text-xs font-semibold px-3 py-1.5 rounded-xl border transition-all ${activeTab === 'admin-panel' ? 'bg-blue-600 text-white border-transparent' : 'bg-blue-500/10 text-blue-400 border-blue-500/20'}`}>
                                    🛡️ Админка
                                </button>
                            )}

                            {currentUser ? (
                                <button 
                                    onClick={() => {
                                        setAuthFirstName(currentUser.firstName || '');
                                        setAuthLastName(currentUser.lastName || '');
                                        setAuthUsername(currentUser.username || '');
                                        setAuthGrade(currentUser.grade || '');
                                        setAuthLetter(currentUser.letter || '');
                                        setShowProfileModal(true);
                                    }}
                                    className={`flex items-center space-x-2 px-3 py-1.5 rounded-full border transition-all ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                                    <div className="w-5 h-5 rounded-full bg-blue-600 text-white text-[10px] flex items-center font-bold justify-center">
                                        {currentUser.avatar || 'У'}
                                    </div>
                                    <span className="text-xs font-semibold">
                                        {hasClass() ? `${currentUser.grade}-${currentUser.letter}` : 'Класс?'}
                                    </span>
                                </button>
                            ) : (
                                <button 
                                    onClick={() => setShowAuthModal(true)}
                                    className="bg-blue-600 text-white text-xs font-semibold px-3.5 py-2 rounded-xl">
                                    Войти
                                </button>
                            )}
                        </div>
                    </header>

                    {isBanned() && (
                        <div className="bg-rose-600 text-white text-xs py-2 px-4 text-center font-semibold">
                            ⚠️ Ваш аккаунт заблокирован.
                        </div>
                    )}

                    <main className="flex-1 p-4 overflow-y-auto space-y-4 pb-28">
                        {(activeTab === 'lost-found' || activeTab === 'hub') && (
                            <div className="relative">
                                <input 
                                    type="text"
                                    placeholder="🔍 Поиск по записям..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className={`w-full text-xs p-3 pl-9 rounded-2xl border focus:outline-none focus:border-blue-500 ${inputClass}`}
                                />
                            </div>
                        )}

                        {activeTab === 'admin-panel' && isAdmin() && (
                            <div className="space-y-4 apple-tab-view">
                                <h2 className="text-xs font-bold text-blue-500 uppercase tracking-widest px-1">Панель администратора</h2>
                                
                                <div className={`p-4 rounded-2xl border space-y-3 ${cardClass}`}>
                                    <h3 className="text-xs font-bold text-blue-400">Назначить администратора</h3>
                                    <form onSubmit={addAdminByUsername} className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="username (без @)" 
                                            value={newAdminInput} 
                                            onChange={e => setNewAdminInput(e.target.value)} 
                                            className={`flex-1 text-xs p-2.5 rounded-xl border ${inputClass}`} 
                                            required 
                                        />
                                        <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl transition">
                                            Добавить
                                        </button>
                                    </form>

                                    <div className="space-y-1 pt-1">
                                        <div className="flex justify-between items-center text-xs p-2 bg-slate-900/50 rounded-xl">
                                            <span className="font-bold">@{ROOT_ADMIN} <span className="text-[10px] text-blue-400">(Главный)</span></span>
                                        </div>
                                        {Object.keys(adminUsers).map(adminTag => (
                                            <div key={adminTag} className="flex justify-between items-center text-xs p-2 bg-slate-900/50 rounded-xl">
                                                <span>@{adminTag}</span>
                                                <button onClick={() => removeAdmin(adminTag)} className="text-rose-400 font-bold">Удалить</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className={`p-4 rounded-2xl border space-y-3 ${cardClass}`}>
                                    <h3 className="text-xs font-bold text-rose-500">Бан пользователей</h3>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const input = e.target.elements.banTag.value.trim();
                                        if(input) { banUserByAdmin(input); e.target.reset(); }
                                    }} className="flex gap-2">
                                        <input name="banTag" type="text" placeholder="username для бана" className={`flex-1 text-xs p-2.5 rounded-xl border ${inputClass}`} required />
                                        <button type="submit" className="bg-rose-500 text-white text-xs font-semibold px-3 py-2.5 rounded-xl">Забанить</button>
                                    </form>
                                    {Object.keys(bannedUsers).length > 0 && (
                                        <div className="space-y-1 pt-1">
                                            {Object.keys(bannedUsers).map(u => (
                                                <div key={u} className="flex justify-between items-center text-xs p-2 bg-slate-900/50 rounded-xl">
                                                    <span>@{u}</span>
                                                    <button onClick={() => unbanUser(u)} className="text-emerald-400 font-bold">Разбанить</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'lost-found' && (
                            <div className="space-y-3.5 apple-tab-view">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest px-1">Бюро Потеряшек</h2>

                                {!isBanned() && (
                                    <div className={`p-4 rounded-[24px] border space-y-3 ${cardClass}`}>
                                        <input 
                                            type="text" 
                                            placeholder="Что потерялось или нашлось? *" 
                                            value={newLostTitle}
                                            onChange={(e) => setNewLostTitle(e.target.value)}
                                            onFocus={checkRegistrationOrPrompt}
                                            className={`w-full text-xs p-3 rounded-xl border focus:outline-none ${inputClass}`}
                                        />
                                        <textarea 
                                            placeholder="Описание..." 
                                            value={newLostDesc}
                                            onChange={(e) => setNewLostDesc(e.target.value)}
                                            onFocus={checkRegistrationOrPrompt}
                                            className={`w-full text-xs p-3 rounded-xl border focus:outline-none resize-none h-18 ${inputClass}`}
                                        />
                                        <div className="flex items-center gap-2">
                                            <label className="cursor-pointer text-xs px-3.5 py-2 rounded-xl font-medium border bg-slate-700 text-slate-200">
                                                📷 Фото
                                                <input type="file" accept="image/*" onChange={(e) => { if(checkRegistrationOrPrompt()) handleImageUpload(e, setNewLostImage); }} className="hidden" />
                                            </label>
                                            {newLostImage && <span className="text-xs text-emerald-400">✓ Загружено</span>}
                                        </div>
                                        <button 
                                            type="button" 
                                            onClick={addLostItem}
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3 rounded-xl transition">
                                            Опубликовать
                                        </button>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {filteredLostItems.map(item => {
                                        const isFound = item.status === 'Найдено';
                                        return (
                                            <div key={item.firebaseId} className={`border rounded-[24px] p-4 space-y-2.5 ${isFound ? 'border-emerald-500/50 bg-emerald-500/5' : ''} ${cardClass}`}>
                                                {item.imageUrl && (
                                                    <div className="w-full bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center">
                                                        <img src={item.imageUrl} alt="Фото" className="w-full h-auto object-contain max-h-[300px]" />
                                                    </div>
                                                )}
                                                <div className="flex justify-between items-start">
                                                    <div className="flex items-center gap-2">
                                                        <h3 className="font-bold text-xs">{item.title}</h3>
                                                        {isFound && <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold">Найдено</span>}
                                                    </div>
                                                    <span className="text-[10px] bg-blue-500/10 text-blue-400 px-2.5 py-0.5 rounded-full font-bold">{item.classStr}</span>
                                                </div>
                                                {item.desc && <p className="text-xs text-slate-300">{item.desc}</p>}
                                                <div className="flex justify-between items-center pt-2 border-t border-slate-700/40">
                                                    <span className="text-[10px] text-slate-400">{item.author}</span>
                                                    <div className="flex gap-1.5 items-center">
                                                        {canDeleteOrEdit(item.authorUsername, item.authorTgId) && (
                                                            <button onClick={() => toggleLostStatus(item.firebaseId, item.status)} className="text-[11px] px-2.5 py-1 rounded-xl bg-amber-500/10 text-amber-400 font-semibold">
                                                                {isFound ? 'Вернуть' : 'Найдено ✅'}
                                                            </button>
                                                        )}
                                                        <button onClick={() => openTelegramChat(item.authorUsername, item.authorTgId, item.title, 'Потеряшка')} className="bg-blue-500/10 text-blue-400 text-[11px] px-3 py-1.5 rounded-xl font-semibold">
                                                            Написать
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'hub' && (
                            <div className="space-y-3.5 apple-tab-view">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest px-1">Лента Лицея</h2>
                                {!isBanned() && (
                                    <div className={`p-4 rounded-[24px] border space-y-3 ${cardClass}`}>
                                        <textarea 
                                            placeholder="Поделитесь новостью... *" 
                                            value={newPostText}
                                            onChange={(e) => setNewPostText(e.target.value)}
                                            onFocus={checkRegistrationOrPrompt}
                                            className={`w-full text-xs p-3 rounded-xl border focus:outline-none resize-none h-18 ${inputClass}`}
                                        />
                                        <div className="flex items-center gap-2">
                                            <label className="cursor-pointer text-xs px-3.5 py-2 rounded-xl font-medium border bg-slate-700 text-slate-200">
                                                📷 Фото
                                                <input type="file" accept="image/*" onChange={(e) => { if(checkRegistrationOrPrompt()) handleImageUpload(e, setNewPostImage); }} className="hidden" />
                                            </label>
                                            {newPostImage && <span className="text-xs text-emerald-400">✓ Загружено</span>}
                                        </div>
                                        <button 
                                            type="button" 
                                            onClick={addPost}
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3 rounded-xl transition">
                                            Опубликовать пост
                                        </button>
                                    </div>
                                )}
                                <div className="space-y-3.5">
                                    {filteredPosts.map(p => {
                                        const comments = p.comments ? Object.keys(p.comments).map(cKey => ({ id: cKey, ...p.comments[cKey] })) : [];
                                        const likesCount = p.likes ? Object.keys(p.likes).length : 0;
                                        const userLiked = currentUser && currentUser.username && p.likes && p.likes[currentUser.username.toLowerCase()];

                                        return (
                                            <div key={p.firebaseId} className={`border rounded-[24px] p-4 space-y-3 ${p.isPinned ? 'border-blue-500/60 bg-blue-500/5' : ''} ${cardClass}`}>
                                                <div className="flex justify-between items-center">
                                                    <div className="flex items-center space-x-2">
                                                        <div className="w-7 h-7 rounded-xl bg-blue-600 text-white text-[11px] font-bold flex items-center justify-center">
                                                            {p.author.charAt(0)}
                                                        </div>
                                                        <div>
                                                            <div className="flex items-center gap-1">
                                                                <span className="text-xs font-bold">{p.author}</span>
                                                                {p.isPinned && <span className="text-[10px] text-blue-400 font-bold">📌</span>}
                                                            </div>
                                                            <span className="text-[10px] text-slate-400">{p.classStr}</span>
                                                        </div>
                                                    </div>
                                                    <span className="text-[10px] text-slate-400">{p.date}</span>
                                                </div>

                                                <p className="text-xs">{p.text}</p>

                                                {p.imageUrl && (
                                                    <div className="w-full bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center">
                                                        <img src={p.imageUrl} alt="Фото" className="w-full h-auto object-contain max-h-[300px]" />
                                                    </div>
                                                )}

                                                <div className="flex justify-between items-center pt-2 border-t border-slate-700/40">
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => toggleLikePost(p.firebaseId, p.likes)} className={`flex items-center gap-1 text-xs px-2.5 py-1 rounded-xl ${userLiked ? 'bg-rose-500/20 text-rose-400 font-bold' : 'bg-slate-500/10 text-slate-400'}`}>
                                                            <span>{userLiked ? '❤️' : '🤍'}</span>
                                                            <span>{likesCount}</span>
                                                        </button>
                                                        <button onClick={() => openTelegramChat(p.authorUsername, p.authorTgId, p.text.substring(0, 15), 'Пост')} className="text-[11px] text-blue-400 font-semibold">
                                                            Написать
                                                        </button>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        {isAdmin() && (
                                                            <button onClick={() => togglePinPost(p.firebaseId, p.isPinned)} className="text-[11px] text-blue-400 font-semibold">📌</button>
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="pt-2 border-t border-slate-700/40 space-y-2">
                                                    {comments.map(c => (
                                                        <div key={c.id} className="p-2 rounded-xl text-[11px] bg-slate-900/60 border border-slate-800 flex justify-between">
                                                            <div>
                                                                <span className="font-bold">{c.author}</span>: <span className="text-slate-300">{c.text}</span>
                                                            </div>
                                                            {(isAdmin() || (currentUser && currentUser.name === c.author)) && (
                                                                <button onClick={() => removeComment(p.firebaseId, c.id)} className="text-rose-400 font-bold ml-2">✕</button>
                                                            )}
                                                        </div>
                                                    ))}
                                                    {!isBanned() && (
                                                        <form onSubmit={(e) => addComment(p.firebaseId, e)} className="flex gap-1.5 pt-1">
                                                            <input 
                                                                type="text" 
                                                                placeholder="Комментарий..."
                                                                value={commentTexts[p.firebaseId] || ''}
                                                                onChange={(e) => setCommentTexts({ ...commentTexts, [p.firebaseId]: e.target.value })}
                                                                onFocus={checkRegistrationOrPrompt}
                                                                className={`flex-1 text-[11px] p-2 rounded-xl border ${inputClass}`}
                                                            />
                                                            <button type="submit" className="bg-blue-600 text-white text-[11px] px-3 py-2 rounded-xl">Отпр.</button>
                                                        </form>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'library' && (
                            <div className="flex flex-col items-center justify-center py-24 space-y-3 text-center apple-tab-view">
                                <div className="w-16 h-16 rounded-3xl border flex items-center justify-center text-2xl bg-slate-800 border-slate-700">📚</div>
                                <h2 className="text-sm font-bold">Библиотека</h2>
                                <p className="text-xs text-slate-500">Скоро появится.</p>
                            </div>
                        )}
                    </main>

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className={`border rounded-[32px] p-6 w-full max-w-xs space-y-4 apple-modal-anim ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200'}`}>
                                <h3 className="font-bold text-center text-sm">Добро пожаловать в Лицейский Хаб</h3>
                                <p className="text-[11px] text-slate-400 text-center">Заполните данные для полной регистрации</p>
                                <form onSubmit={handleSaveProfile} className="space-y-3 w-full">
                                    <div className="flex gap-2 w-full">
                                        <input 
                                            type="text" 
                                            placeholder="Имя *" 
                                            value={authFirstName} 
                                            onChange={e => setAuthFirstName(e.target.value)} 
                                            className={`flex-1 min-w-0 text-xs p-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} 
                                            required
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="Фамилия *" 
                                            value={authLastName} 
                                            onChange={e => setAuthLastName(e.target.value)} 
                                            className={`flex-1 min-w-0 text-xs p-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} 
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-semibold block mb-1">Telegram @username *</label>
                                        <div className="relative flex items-center">
                                            <span className="absolute left-3 text-xs text-slate-400 font-semibold">@</span>
                                            <input 
                                                type="text" 
                                                placeholder="username" 
                                                value={authUsername.replace(/^@/, '')} 
                                                onChange={e => setAuthUsername(e.target.value)} 
                                                className={`w-full text-xs p-2.5 pl-7 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} 
                                                required 
                                            />
                                        </div>
                                    </div>
                                    <div className="flex gap-2 w-full">
                                        <div className="flex-1 min-w-0">
                                            <label className="text-[10px] text-slate-400 font-semibold block mb-1">Класс *</label>
                                            <select value={authGrade} onChange={e => setAuthGrade(e.target.value)} className={`w-full text-xs p-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} required>
                                                <option value="">Параллель</option>
                                                {['5','6','7','8','9','10','11'].map(g => <option key={g} value={g}>{g}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <label className="text-[10px] text-slate-400 font-semibold block mb-1">Буква *</label>
                                            <select value={authLetter} onChange={e => setAuthLetter(e.target.value)} className={`w-full text-xs p-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} required>
                                                <option value="">Буква</option>
                                                {getAvailableLetters(authGrade).map(l => <option key={l} value={l}>{l}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3 rounded-xl transition shadow-md">Зарегистрироваться</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showProfileModal && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className={`border rounded-[32px] p-6 w-full max-w-xs space-y-4 apple-modal-anim ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200'}`}>
                                <h3 className="font-bold text-center text-sm">
                                    {isAdmin() ? "Изменение данных (Админ)" : "Регистрация / Профиль"}
                                </h3>
                                <p className="text-[10px] text-slate-400 text-center leading-relaxed">
                                    {!isFullyRegistered() 
                                        ? "Заполните Имя и Фамилию для создания постов и комментариев" 
                                        : (isAdmin() ? "Изменение данных без подтверждения" : "Смена имени или класса требует подтверждения администратора")}
                                </p>
                                <form onSubmit={handleSaveProfile} className="space-y-3 w-full">
                                    <div className="flex gap-2 w-full">
                                        <input 
                                            type="text" 
                                            placeholder="Имя *" 
                                            value={authFirstName} 
                                            onChange={e => setAuthFirstName(e.target.value)} 
                                            className={`flex-1 min-w-0 text-xs p-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} 
                                            required
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="Фамилия *" 
                                            value={authLastName} 
                                            onChange={e => setAuthLastName(e.target.value)} 
                                            className={`flex-1 min-w-0 text-xs p-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} 
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-semibold block mb-1">Telegram @username</label>
                                        <div className="relative flex items-center">
                                            <span className="absolute left-3 text-xs text-slate-400 font-semibold">@</span>
                                            <input 
                                                type="text" 
                                                placeholder="username" 
                                                value={authUsername.replace(/^@/, '')} 
                                                onChange={e => setAuthUsername(e.target.value)} 
                                                className={`w-full text-xs p-2.5 pl-7 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} 
                                                required 
                                            />
                                        </div>
                                    </div>
                                    <div className="flex gap-2 w-full">
                                        <select value={authGrade} onChange={e => setAuthGrade(e.target.value)} className={`flex-1 min-w-0 text-xs p-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} required>
                                            {['5','6','7','8','9','10','11'].map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                        <select value={authLetter} onChange={e => setAuthLetter(e.target.value)} className={`flex-1 min-w-0 text-xs p-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${inputClass}`} required>
                                            {getAvailableLetters(authGrade).map(l => <option key={l} value={l}>{l}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex gap-2 pt-1 w-full">
                                        <button type="button" onClick={() => setShowProfileModal(false)} className="flex-1 text-xs py-3 rounded-xl bg-slate-800 text-slate-300">Отмена</button>
                                        <button type="submit" className="flex-1 bg-blue-600 text-white text-xs py-3 rounded-xl font-semibold">
                                            {isAdmin() || !isFullyRegistered() ? "Сохранить" : "Запросить"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <nav className={`absolute bottom-0 left-0 right-0 backdrop-blur-xl border-t px-6 py-3 flex justify-around z-10 ${navClass}`}>
                        <button onClick={() => setActiveTab('lost-found')} className={`text-xs font-semibold px-5 py-1.5 rounded-2xl transition-all duration-300 ${activeTab === 'lost-found' ? 'text-blue-400 bg-blue-500/10 scale-105 shadow-sm' : 'text-slate-400'}`}>Потеряшки</button>
                        <button onClick={() => setActiveTab('library')} className={`text-xs font-semibold px-5 py-1.5 rounded-2xl transition-all duration-300 ${activeTab === 'library' ? 'text-blue-400 bg-blue-500/10 scale-105 shadow-sm' : 'text-slate-400'}`}>Библиотека</button>
                        <button onClick={() => setActiveTab('hub')} className={`text-xs font-semibold px-5 py-1.5 rounded-2xl transition-all duration-300 ${activeTab === 'hub' ? 'text-blue-400 bg-blue-500/10 scale-105 shadow-sm' : 'text-slate-400'}`}>Лента</button>
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
