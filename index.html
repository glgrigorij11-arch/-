<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лицей 31 — Школьный Хаб</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center items-center">
    <div id="root" class="w-full max-w-md h-screen sm:h-[850px] sm:rounded-3xl sm:shadow-xl overflow-hidden flex flex-col bg-white border border-slate-200/60 relative"></div>

    <script type="text/babel">
        const firebaseConfig = { 
            apiKey: "AIzaSyDNaWJbKE6Wvj_gGnNAre5v0PCaxSmVXOo", 
            authDomain: "lyceum31.firebaseapp.com", 
            databaseURL: "https://lyceum31-default-rtdb.firebaseio.com", 
            projectId: "lyceum31", 
            storageBucket: "lyceum31.firebasestorage.app", 
            messagingSenderId: "309039351893", 
            appId: "1:309039351893:web:4f969add85f92325406cdc", 
            measurementId: "G-5KE6VEHLC9" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const ROOT_ADMIN = "destroyyyx"; 

        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('lost-found');
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            
            // Кастомное внутреннее уведомление вместо alert()
            const [toastMessage, setToastMessage] = useState(null);

            const showNotification = (text) => {
                setToastMessage(text);
                setTimeout(() => {
                    setToastMessage(null);
                }, 3000);
            };
            
            const [editingItem, setEditingItem] = useState(null); 
            const [editTitle, setEditTitle] = useState('');
            const [editDesc, setEditDesc] = useState('');
            const [editImage, setEditImage] = useState('');

            const [authName, setAuthName] = useState('');
            const [authUsername, setAuthUsername] = useState('');
            const [authGrade, setAuthGrade] = useState('');
            const [authLetter, setAuthLetter] = useState('');

            const [commentTexts, setCommentTexts] = useState({});

            const [lostItems, setLostItems] = useState([]);
            const [posts, setPosts] = useState([]);
            const [bannedUsers, setBannedUsers] = useState({});
            const [adminUsers, setAdminUsers] = useState({});
            const [profileRequests, setProfileRequests] = useState({});

            const [newLostTitle, setNewLostTitle] = useState('');
            const [newLostDesc, setNewLostDesc] = useState('');
            const [newLostImage, setNewLostImage] = useState('');

            const [newPostText, setNewPostText] = useState('');
            const [newPostImage, setNewPostImage] = useState('');

            const getAvailableLetters = (grade) => {
                if (grade === '10' || grade === '11') return ['А', 'Б', 'В'];
                return ['А', 'Б', 'В', 'Г'];
            };

            // Авторизация
            useEffect(() => {
                const savedUser = localStorage.getItem('lyceum_user');
                if (savedUser) {
                    setCurrentUser(JSON.parse(savedUser));
                }

                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();

                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        const tgUser = tg.initDataUnsafe.user;
                        const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || tgUser.username || 'Ученик';
                        
                        if (!savedUser) {
                            const defaultUser = {
                                name: fullName,
                                username: tgUser.username ? tgUser.username.toLowerCase() : '',
                                tgId: tgUser.id,
                                grade: '',
                                letter: '',
                                avatar: fullName.charAt(0).toUpperCase()
                            };
                            setCurrentUser(defaultUser);
                            setShowAuthModal(true);
                        }
                    }
                } else if (!savedUser) {
                    setShowAuthModal(true);
                }
            }, []);

            // Синхронизация с Firebase
            useEffect(() => {
                db.ref('lost_items').on('value', (snapshot) => {
                    const data = snapshot.val();
                    setLostItems(data ? Object.keys(data).map(key => ({ firebaseId: key, ...data[key] })).reverse() : []);
                });

                db.ref('posts').on('value', (snapshot) => {
                    const data = snapshot.val();
                    setPosts(data ? Object.keys(data).map(key => ({ firebaseId: key, ...data[key] })).reverse() : []);
                });

                db.ref('banned_users').on('value', (snapshot) => {
                    setBannedUsers(snapshot.val() || {});
                });

                db.ref('admin_users').on('value', (snapshot) => {
                    setAdminUsers(snapshot.val() || {});
                });

                db.ref('profile_requests').on('value', (snapshot) => {
                    setProfileRequests(snapshot.val() || {});
                });
            }, []);

            const isBanned = () => {
                if (!currentUser || !currentUser.username) return false;
                return !!bannedUsers[currentUser.username.toLowerCase()];
            };

            const isAdmin = () => {
                if (!currentUser || !currentUser.username) return false;
                const tag = currentUser.username.toLowerCase();
                return tag === ROOT_ADMIN.toLowerCase() || !!adminUsers[tag];
            };

            const hasClass = () => {
                return currentUser && currentUser.grade && currentUser.letter;
            };

            const addAdmin = (username) => {
                if (!username) return;
                const cleanTag = username.replace('@', '').toLowerCase();
                db.ref(`admin_users/${cleanTag}`).set(true);
                showNotification(`Пользователь @${cleanTag} назначен администратором!`);
            };

            const removeAdmin = (username) => {
                if (username.toLowerCase() === ROOT_ADMIN.toLowerCase()) {
                    showNotification("Нельзя удалить главного администратора!");
                    return;
                }
                db.ref(`admin_users/${username}`).remove();
                showNotification(`Администратор @${username} удален.`);
            };

            const banUserByAdmin = (username) => {
                if (!username) return;
                const cleanTag = username.replace('@', '').toLowerCase();
                if (cleanTag === ROOT_ADMIN.toLowerCase()) { showNotification("Нельзя забанить главного администратора!"); return; }
                db.ref(`banned_users/${cleanTag}`).set(true);
                showNotification(`Пользователь @${cleanTag} забанен.`);
            };

            const unbanUser = (username) => {
                db.ref(`banned_users/${username}`).remove();
                showNotification(`Пользователь @${username} разбанен.`);
            };

            // Обработка сохранения профиля
            const handleSaveProfile = (e) => {
                e.preventDefault();
                if (!authName.trim() || !authGrade || !authLetter) {
                    showNotification("Пожалуйста, заполните все поля, включая класс и букву.");
                    return;
                }
                const cleanTag = authUsername.replace('@', '').trim().toLowerCase();
                const newProfileData = {
                    name: authName.trim(),
                    username: cleanTag,
                    grade: authGrade,
                    letter: authLetter,
                    avatar: authName.trim().charAt(0).toUpperCase(),
                    tgId: currentUser ? currentUser.tgId : Date.now()
                };

                if (!currentUser || !currentUser.grade || isAdmin()) {
                    setCurrentUser(newProfileData);
                    localStorage.setItem('lyceum_user', JSON.stringify(newProfileData));
                    setShowAuthModal(false);
                    setShowProfileModal(false);
                    if (isAdmin() && currentUser && currentUser.grade) {
                        showNotification("Профиль успешно изменен!");
                    }
                    return;
                }

                const requestText = `Здравствуйте! Прошу подтвердить изменение моих данных в Лицейском Хабе:\nИмя: ${newProfileData.name}\nUsername: @${newProfileData.username || 'нет'}\nКласс: ${newProfileData.grade}-${newProfileData.letter}`;
                const encoded = encodeURIComponent(requestText);
                
                window.open(`https://t.me/${ROOT_ADMIN}?text=${encoded}`, '_blank');
                setShowProfileModal(false);
                showNotification("Запрос отправлен администратору в Telegram");
            };

            const canDeleteOrEdit = (itemAuthorUsername, itemAuthorTgId) => {
                if (!currentUser) return false;
                const isAuthor = (currentUser.username && currentUser.username === itemAuthorUsername) || (currentUser.tgId && currentUser.tgId === itemAuthorTgId);
                return isAdmin() || isAuthor;
            };

            const startEditing = (item, type) => {
                setEditingItem({ ...item, type });
                setEditTitle(item.title || item.text || '');
                setEditDesc(item.desc || item.author || '');
                setEditImage(item.imageUrl || '');
            };

            const saveEditedItem = (e) => {
                e.preventDefault();
                if (!editingItem) return;

                const { firebaseId, type } = editingItem;
                let updates = {};

                if (type === 'lost') {
                    updates = { title: editTitle, desc: editDesc, imageUrl: editImage };
                    db.ref(`lost_items/${firebaseId}`).update(updates);
                } else if (type === 'post') {
                    updates = { text: editTitle, imageUrl: editImage };
                    db.ref(`posts/${firebaseId}`).update(updates);
                }

                setEditingItem(null);
                showNotification("Запись успешно обновлена!");
            };

            const openTelegramChat = (username, tgId, itemTitle, itemType) => {
                let defaultText = `Здравствуйте! Пишу по поводу вашего объявления «${itemTitle}» (${itemType}).`;
                const encodedText = encodeURIComponent(defaultText);

                if (username) {
                    window.open(`https://t.me/${username}?text=${encodedText}`, '_blank');
                } else if (tgId) {
                    window.open(`tg://user?id=${tgId}`, '_blank');
                } else {
                    showNotification("У пользователя не указан username в Telegram");
                }
            };

            const handleImageUpload = (e, setImageCallback) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 1000;
                        if (width > MAX_SIZE || height > MAX_SIZE) {
                            if (width > height) {
                                height = Math.round((height * MAX_SIZE) / width);
                                width = MAX_SIZE;
                            } else {
                                width = Math.round((width * MAX_SIZE) / height);
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        let quality = 0.8;
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);
                        while (dataUrl.length > 1.5 * 1024 * 1024 && quality > 0.2) {
                            quality -= 0.1;
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                        }
                        setImageCallback(dataUrl);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const openProfileSettings = () => {
                if (currentUser) {
                    setAuthName(currentUser.name);
                    setAuthUsername(currentUser.username || '');
                    setAuthGrade(currentUser.grade || '');
                    setAuthLetter(currentUser.letter || '');
                }
                setShowProfileModal(true);
            };

            const addLostItem = (e) => {
                e.preventDefault();
                if (!hasClass()) { showNotification("Укажите свой класс в профиле."); setShowProfileModal(true); return; }
                if (isBanned()) { showNotification("Вы забанены."); return; }
                if (!newLostTitle.trim() || !currentUser) return;
                
                db.ref('lost_items').push({
                    title: newLostTitle,
                    desc: newLostDesc,
                    imageUrl: newLostImage,
                    author: currentUser.name,
                    authorUsername: currentUser.username,
                    authorTgId: currentUser.tgId,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    date: new Date().toLocaleDateString()
                });

                setNewLostTitle('');
                setNewLostDesc('');
                setNewLostImage('');
                showNotification("Объявление опубликовано!");
            };

            const removeLostItem = (firebaseId) => {
                db.ref(`lost_items/${firebaseId}`).remove();
                showNotification("Объявление удалено.");
            };

            const addPost = (e) => {
                e.preventDefault();
                if (!hasClass()) { showNotification("Укажите свой класс в профиле."); setShowProfileModal(true); return; }
                if (isBanned()) { showNotification("Вы забанены."); return; }
                if (!newPostText.trim() || !currentUser) return;

                db.ref('posts').push({
                    text: newPostText,
                    imageUrl: newPostImage,
                    author: currentUser.name,
                    authorUsername: currentUser.username,
                    authorTgId: currentUser.tgId,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                setNewPostText('');
                setNewPostImage('');
                showNotification("Пост опубликован в ленте!");
            };

            const removePost = (firebaseId) => {
                db.ref(`posts/${firebaseId}`).remove();
                showNotification("Пост удален.");
            };

            const addComment = (postId, e) => {
                e.preventDefault();
                if (!hasClass()) { showNotification("Укажите свой класс в профиле."); setShowProfileModal(true); return; }
                if (isBanned()) { showNotification("Вы забанены."); return; }
                const text = commentTexts[postId];
                if (!text || !text.trim()) return;

                db.ref(`posts/${postId}/comments`).push({
                    text: text.trim(),
                    author: currentUser.name,
                    classStr: `${currentUser.grade}-${currentUser.letter}`,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                setCommentTexts({ ...commentTexts, [postId]: '' });
            };

            const removeComment = (postId, commentId) => {
                db.ref(`posts/${postId}/comments/${commentId}`).remove();
            };

            return (
                <div className="flex flex-col h-full bg-slate-50 text-slate-800 relative overflow-hidden">
                    
                    {/* Кастомное уведомление (Тост) вместо alert */}
                    {toastMessage && (
                        <div className="absolute top-14 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-2xl shadow-xl transition animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {/* Шапка */}
                    <header className="px-4 py-3 bg-white/80 backdrop-blur-md border-b border-slate-200/80 flex items-center justify-between sticky top-0 z-20">
                        <div className="flex items-center space-x-2.5">
                            <div className="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                                31
                            </div>
                            <div>
                                <h1 className="font-bold text-slate-900 text-sm leading-tight">Лицей 31</h1>
                                <p className="text-[10px] text-slate-400 font-medium">Школьный хаб</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-1.5">
                            {isAdmin() && (
                                <button 
                                    onClick={() => setActiveTab('admin-panel')}
                                    className={`text-xs font-semibold px-2.5 py-1.5 rounded-xl border transition ${activeTab === 'admin-panel' ? 'bg-blue-600 text-white border-blue-600' : 'bg-blue-50 text-blue-600 border-blue-200'}`}>
                                    🛡️ Админка
                                </button>
                            )}

                            {currentUser ? (
                                <button 
                                    onClick={openProfileSettings}
                                    className="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-full border border-slate-200 transition">
                                    <div className="w-5 h-5 rounded-full bg-blue-600 text-white text-[10px] flex items-center font-bold justify-center">
                                        {currentUser.avatar}
                                    </div>
                                    <span className="text-xs font-medium text-slate-700">
                                        {hasClass() ? `${currentUser.grade}-${currentUser.letter}` : 'Нет класса'}
                                    </span>
                                </button>
                            ) : (
                                <button 
                                    onClick={() => { setAuthName(''); setAuthUsername(''); setShowAuthModal(true); }}
                                    className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl shadow-sm transition">
                                    Войти
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Бан-баннер */}
                    {isBanned() && (
                        <div className="bg-rose-500 text-white text-xs py-2 px-4 text-center font-semibold">
                            ⚠️ Ваш аккаунт заблокирован администратором. Публикация записей ограничена.
                        </div>
                    )}

                    {/* Предупреждение о невыбранном классе */}
                    {currentUser && !hasClass() && (
                        <div className="bg-amber-500 text-white text-xs py-2 px-4 text-center font-semibold flex justify-between items-center">
                            <span>⚠️ Вы не указали класс. Без этого нельзя публиковать и комментировать.</span>
                            <button onClick={openProfileSettings} className="bg-white text-amber-600 px-2.5 py-1 rounded-lg text-[11px] font-bold">Указать</button>
                        </div>
                    )}

                    {/* Контент */}
                    <main className="flex-1 p-4 overflow-y-auto space-y-4 pb-24">
                        
                        {/* ПАНЕЛЬ АДМИНА */}
                        {activeTab === 'admin-panel' && isAdmin() && (
                            <div className="space-y-4">
                                <h2 className="text-sm font-bold text-blue-600 uppercase tracking-wider px-1">Панель администратора</h2>
                                
                                {/* Управление банами */}
                                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                                    <h3 className="text-xs font-bold text-rose-600">Черный список и Бан</h3>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const input = e.target.elements.banTag.value.trim();
                                        if(input) { banUserByAdmin(input); e.target.reset(); }
                                    }} className="flex gap-2">
                                        <input 
                                            name="banTag"
                                            type="text" 
                                            placeholder="username для бана (без @)" 
                                            className="flex-1 text-xs p-2 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-rose-500"
                                            required
                                        />
                                        <button type="submit" className="bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold px-3 py-2 rounded-xl">
                                            Забанить
                                        </button>
                                    </form>

                                    {Object.keys(bannedUsers).length > 0 && (
                                        <div className="space-y-2 pt-1">
                                            {Object.keys(bannedUsers).map(username => (
                                                <div key={username} className="flex justify-between items-center bg-slate-50 p-2 rounded-xl border text-xs">
                                                    <span className="font-bold text-slate-800">@{username}</span>
                                                    <button 
                                                        onClick={() => unbanUser(username)}
                                                        className="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-2.5 py-1 rounded-lg font-semibold transition">
                                                        Разбанить
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                                    <h3 className="text-xs font-bold text-slate-800">Список администраторов</h3>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const input = e.target.elements.newAdminTag.value.trim();
                                        if(input) { addAdmin(input); e.target.reset(); }
                                    }} className="flex gap-2">
                                        <input 
                                            name="newAdminTag"
                                            type="text" 
                                            placeholder="username (без @)" 
                                            className="flex-1 text-xs p-2 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500"
                                            required
                                        />
                                        <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-xl">
                                            Добавить
                                        </button>
                                    </form>

                                    <div className="space-y-1.5 pt-1">
                                        <div className="flex justify-between items-center bg-slate-50 p-2 rounded-xl border text-xs">
                                            <span className="font-bold text-slate-800">@{ROOT_ADMIN} <span className="text-[10px] text-blue-600">(Главный)</span></span>
                                        </div>
                                        {Object.keys(adminUsers).map(adminTag => (
                                            <div key={adminTag} className="flex justify-between items-center bg-slate-50 p-2 rounded-xl border text-xs">
                                                <span className="font-semibold text-slate-800">@{adminTag}</span>
                                                <button 
                                                    onClick={() => removeAdmin(adminTag)}
                                                    className="text-rose-500 hover:underline font-semibold text-[11px]">
                                                    Удалить
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ПОТЕРЯШКИ */}
                        {activeTab === 'lost-found' && (
                            <div className="space-y-3">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider px-1">Бюро Потеряшек</h2>

                                {currentUser && hasClass() && !isBanned() && (
                                    <form onSubmit={addLostItem} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2.5">
                                        <input 
                                            type="text" 
                                            placeholder="Что потерялось или нашлось?" 
                                            value={newLostTitle}
                                            onChange={(e) => setNewLostTitle(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800"
                                        />
                                        <textarea 
                                            placeholder="Описание, где оставлено..." 
                                            value={newLostDesc}
                                            onChange={(e) => setNewLostDesc(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800 resize-none h-16"
                                        />
                                        <div className="flex items-center gap-2 pt-1 flex-wrap">
                                            <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-2 rounded-xl font-medium border transition flex items-center gap-1.5">
                                                📷 Прикрепить фото
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, setNewLostImage)} className="hidden" />
                                            </label>
                                            {newLostImage && (
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[11px] text-emerald-600 font-medium">✓ Фото загружено</span>
                                                    <button type="button" onClick={() => setNewLostImage('')} className="text-[11px] text-rose-500 hover:underline font-semibold">Удалить фото</button>
                                                </div>
                                            )}
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow-sm transition">
                                            Опубликовать
                                        </button>
                                    </form>
                                )}

                                <div className="space-y-2.5">
                                    {lostItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 text-xs">Нет объявлений о потерянных вещах.</div>
                                    ) : (
                                        lostItems.map(item => (
                                            <div key={item.firebaseId} className="bg-white border border-slate-200/80 rounded-2xl p-3.5 shadow-sm space-y-2">
                                                {item.imageUrl && (
                                                    <div className="w-full bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
                                                        <img src={item.imageUrl} alt="Фото" className="w-full h-auto object-contain max-h-[350px]" />
                                                    </div>
                                                )}
                                                <div className="flex justify-between items-start">
                                                    <h3 className="font-semibold text-slate-900 text-xs">{item.title}</h3>
                                                    <span className="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-semibold">{item.classStr}</span>
                                                </div>
                                                {item.desc && <p className="text-xs text-slate-600">{item.desc}</p>}
                                                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                                    <span className="text-[10px] text-slate-400">{item.author}</span>
                                                    <div className="flex gap-1.5 items-center">
                                                        <button 
                                                            onClick={() => openTelegramChat(item.authorUsername, item.authorTgId, item.title, 'Потеряшка')}
                                                            className="bg-sky-50 text-sky-600 hover:bg-sky-100 text-[11px] px-2.5 py-1 rounded-lg font-medium transition">
                                                            Написать
                                                        </button>
                                                        {canDeleteOrEdit(item.authorUsername, item.authorTgId) && (
                                                            <>
                                                                <button 
                                                                    onClick={() => startEditing(item, 'lost')}
                                                                    className="bg-amber-50 text-amber-600 hover:bg-amber-100 text-[11px] px-2 py-1 rounded-lg font-medium transition" title="Редактировать">
                                                                    ✏️
                                                                </button>
                                                                <button 
                                                                    onClick={() => removeLostItem(item.firebaseId)}
                                                                    className="bg-rose-50 text-rose-600 hover:bg-rose-100 text-[11px] px-2.5 py-1 rounded-lg font-medium transition">
                                                                    Удалить
                                                                </button>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* БИБЛИОТЕКА (В разработке) */}
                        {activeTab === 'library' && (
                            <div className="flex flex-col items-center justify-center py-20 space-y-2 text-center">
                                <div className="text-3xl">📚</div>
                                <h2 className="text-sm font-bold text-slate-800">Библиотека</h2>
                                <p className="text-xs text-slate-400">Раздел находится в разработке...</p>
                            </div>
                        )}

                        {/* ЛЕНТА */}
                        {activeTab === 'hub' && (
                            <div className="space-y-3">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider px-1">Лента Лицея</h2>
                                {currentUser && hasClass() && !isBanned() && (
                                    <form onSubmit={addPost} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2.5">
                                        <textarea 
                                            placeholder="Поделитесь новостью..." 
                                            value={newPostText}
                                            onChange={(e) => setNewPostText(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 text-slate-800 resize-none h-16"
                                        />
                                        <div className="flex items-center gap-2 pt-1 flex-wrap">
                                            <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-2 rounded-xl font-medium border transition flex items-center gap-1.5">
                                                📷 Прикрепить фото
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, setNewPostImage)} className="hidden" />
                                            </label>
                                            {newPostImage && (
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[11px] text-emerald-600 font-medium">✓ Фото загружено</span>
                                                    <button type="button" onClick={() => setNewPostImage('')} className="text-[11px] text-rose-500 hover:underline font-semibold">Удалить фото</button>
                                                </div>
                                            )}
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow-sm transition">
                                            Опубликовать пост
                                        </button>
                                    </form>
                                )}
                                <div className="space-y-3">
                                    {posts.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 text-xs">Лента новостей пуста.</div>
                                    ) : (
                                        posts.map(p => {
                                            const comments = p.comments ? Object.keys(p.comments).map(cKey => ({ id: cKey, ...p.comments[cKey] })) : [];
                                            return (
                                                <div key={p.firebaseId} className="bg-white border border-slate-200/80 rounded-2xl p-3.5 shadow-sm space-y-2.5">
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex items-center space-x-2">
                                                            <div className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 text-[10px] font-bold flex items-center justify-center">
                                                                {p.author.charAt(0)}
                                                            </div>
                                                            <div>
                                                                <span className="text-xs font-semibold text-slate-900 block leading-none">{p.author}</span>
                                                                <span className="text-[10px] text-slate-400">{p.classStr}</span>
                                                            </div>
                                                        </div>
                                                        <span className="text-[10px] text-slate-400">{p.date}</span>
                                                    </div>

                                                    <p className="text-xs text-slate-700 leading-relaxed">{p.text}</p>

                                                    {p.imageUrl && (
                                                        <div className="w-full bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
                                                            <img src={p.imageUrl} alt="Фото" className="w-full h-auto object-contain max-h-[350px]" />
                                                        </div>
                                                    )}

                                                    <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                                        <button 
                                                            onClick={() => openTelegramChat(p.authorUsername, p.authorTgId, p.text.substring(0, 20) + '...', 'Пост в ленте')}
                                                            className="text-[11px] text-blue-600 font-semibold hover:underline">
                                                            Написать автору
                                                        </button>
                                                        <div className="flex gap-2 items-center">
                                                            {canDeleteOrEdit(p.authorUsername, p.authorTgId) && (
                                                                <>
                                                                    <button 
                                                                        onClick={() => startEditing(p, 'post')}
                                                                        className="text-[11px] text-amber-600 font-semibold hover:underline" title="Редактировать">
                                                                        ✏️ Изменить
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => removePost(p.firebaseId)}
                                                                        className="text-[11px] text-rose-500 font-semibold hover:underline">
                                                                        Удалить
                                                                    </button>
                                                                </>
                                                            )}
                                                        </div>
                                                    </div>

                                                    {/* Комментарии */}
                                                    <div className="pt-2 border-t border-slate-100 space-y-2">
                                                        {comments.length > 0 && (
                                                            <div className="space-y-1.5">
                                                                {comments.map(c => (
                                                                    <div key={c.id} className="bg-slate-50 p-2 rounded-xl text-[11px] flex justify-between items-start">
                                                                        <div>
                                                                            <span className="font-bold text-slate-800">{c.author}</span> <span className="text-slate-400">({c.classStr}):</span>
                                                                            <p className="text-slate-700 mt-0.5">{c.text}</p>
                                                                        </div>
                                                                        {(isAdmin() || (currentUser && currentUser.name === c.author)) && (
                                                                            <button onClick={() => removeComment(p.firebaseId, c.id)} className="text-rose-500 text-[10px] hover:underline ml-2">✕</button>
                                                                        )}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}

                                                        {currentUser && hasClass() && !isBanned() && (
                                                            <form onSubmit={(e) => addComment(p.firebaseId, e)} className="flex gap-1.5 pt-1">
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Написать комментарий..."
                                                                    value={commentTexts[p.firebaseId] || ''}
                                                                    onChange={(e) => setCommentTexts({ ...commentTexts, [p.firebaseId]: e.target.value })}
                                                                    className="flex-1 text-[11px] p-2 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500"
                                                                />
                                                                <button type="submit" className="bg-blue-600 text-white text-[11px] font-semibold px-3 py-1.5 rounded-xl">
                                                                    Отправить
                                                                </button>
                                                            </form>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Модальное окно редактирования */}
                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl p-5 w-full max-w-xs space-y-3.5 shadow-xl">
                                <h3 className="font-bold text-slate-900 text-center text-sm">Редактирование</h3>
                                <form onSubmit={saveEditedItem} className="space-y-3">
                                    <div>
                                        <label className="text-[11px] text-slate-500 font-medium block mb-1">
                                            {editingItem.type === 'post' ? 'Текст поста' : 'Название / Заголовок'}
                                        </label>
                                        <textarea 
                                            value={editTitle}
                                            onChange={(e) => setEditTitle(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 resize-none h-20"
                                            required
                                        />
                                    </div>
                                    {editingItem.type !== 'post' && (
                                        <div>
                                            <label className="text-[11px] text-slate-500 font-medium block mb-1">Описание</label>
                                            <input 
                                                type="text" 
                                                value={editDesc}
                                                onChange={(e) => setEditDesc(e.target.value)}
                                                className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800"
                                            />
                                        </div>
                                    )}
                                    <div className="space-y-1.5">
                                        <label className="text-[11px] text-slate-500 font-medium block">Фотография</label>
                                        {editImage && (
                                            <div className="relative w-full h-24 bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
                                                <img src={editImage} alt="Превью" className="w-full h-full object-contain" />
                                            </div>
                                        )}
                                        <div className="flex gap-2 items-center">
                                            <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] px-2.5 py-1.5 rounded-xl font-medium border transition flex items-center gap-1">
                                                📷 Изменить фото
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, setEditImage)} className="hidden" />
                                            </label>
                                            {editImage && (
                                                <button type="button" onClick={() => setEditImage('')} className="bg-rose-50 text-rose-600 hover:bg-rose-100 text-[11px] px-2.5 py-1.5 rounded-xl font-medium transition">
                                                    Удалить фото
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                    <div className="pt-1 flex gap-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setEditingItem(null)}
                                            className="flex-1 bg-slate-100 text-slate-600 text-xs font-semibold py-2.5 rounded-xl hover:bg-slate-200 transition">
                                            Отмена
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 bg-blue-600 text-white text-xs font-semibold py-2.5 rounded-xl hover:bg-blue-700 transition">
                                            Сохранить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Модальное окно первого входа */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl p-5 w-full max-w-xs space-y-3.5 shadow-xl">
                                <h3 className="font-bold text-slate-900 text-center text-sm">Вход в Лицейский Хаб</h3>
                                <form onSubmit={handleSaveProfile} className="space-y-3">
                                    <div>
                                        <label className="text-[11px] text-slate-500 font-medium block mb-1">Имя и фамилия</label>
                                        <input 
                                            type="text" 
                                            placeholder="Иван Иванов" 
                                            value={authName}
                                            onChange={(e) => setAuthName(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-slate-500 font-medium block mb-1">Telegram @username</label>
                                        <input 
                                            type="text" 
                                            placeholder="username" 
                                            value={authUsername}
                                            onChange={(e) => setAuthUsername(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800"
                                        />
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <label className="text-[11px] text-slate-500 font-medium block mb-1">Параллель</label>
                                            <select 
                                                value={authGrade} 
                                                onChange={(e) => {
                                                    const newGrade = e.target.value;
                                                    setAuthGrade(newGrade);
                                                    const allowedLetters = getAvailableLetters(newGrade);
                                                    if (!allowedLetters.includes(authLetter)) {
                                                        setAuthLetter(allowedLetters[0]);
                                                    }
                                                }}
                                                className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200" required>
                                                <option value="">Выберите</option>
                                                <option value="5">5</option>
                                                <option value="6">6</option>
                                                <option value="7">7</option>
                                                <option value="8">8</option>
                                                <option value="9">9</option>
                                                <option value="10">10</option>
                                                <option value="11">11</option>
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-[11px] text-slate-500 font-medium block mb-1">Буква</label>
                                            <select 
                                                value={authLetter} 
                                                onChange={(e) => setAuthLetter(e.target.value)}
                                                className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200" required>
                                                <option value="">-</option>
                                                {getAvailableLetters(authGrade).map(l => (
                                                    <option key={l} value={l}>{l}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-1">
                                        <button 
                                            type="submit" 
                                            className="w-full bg-blue-600 text-white text-xs font-semibold py-2.5 rounded-xl hover:bg-blue-700 transition">
                                            Продолжить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Модальное окно профиля */}
                    {showProfileModal && (
                        <div className="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-3xl p-5 w-full max-w-xs space-y-3.5 shadow-xl">
                                <h3 className="font-bold text-slate-900 text-center text-sm">Настройки профиля</h3>
                                <p className="text-[10px] text-slate-400 text-center">
                                    {isAdmin() ? "Изменение данных (Админ)" : "Изменение сформирует запрос администратору (@" + ROOT_ADMIN + ")"}
                                </p>
                                <form onSubmit={handleSaveProfile} className="space-y-3">
                                    <div>
                                        <label className="text-[11px] text-slate-500 font-medium block mb-1">Имя и фамилия</label>
                                        <input 
                                            type="text" 
                                            value={authName}
                                            onChange={(e) => setAuthName(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-slate-500 font-medium block mb-1">Telegram @username</label>
                                        <input 
                                            type="text" 
                                            value={authUsername}
                                            onChange={(e) => setAuthUsername(e.target.value)}
                                            className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800"
                                        />
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <label className="text-[11px] text-slate-500 font-medium block mb-1">Параллель</label>
                                            <select 
                                                value={authGrade} 
                                                onChange={(e) => {
                                                    const newGrade = e.target.value;
                                                    setAuthGrade(newGrade);
                                                    const allowedLetters = getAvailableLetters(newGrade);
                                                    if (!allowedLetters.includes(authLetter)) {
                                                        setAuthLetter(allowedLetters[0]);
                                                    }
                                                }}
                                                className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200" required>
                                                <option value="5">5</option>
                                                <option value="6">6</option>
                                                <option value="7">7</option>
                                                <option value="8">8</option>
                                                <option value="9">9</option>
                                                <option value="10">10</option>
                                                <option value="11">11</option>
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-[11px] text-slate-500 font-medium block mb-1">Буква</label>
                                            <select 
                                                value={authLetter} 
                                                onChange={(e) => setAuthLetter(e.target.value)}
                                                className="w-full text-xs p-2.5 rounded-xl bg-slate-50 border border-slate-200" required>
                                                {getAvailableLetters(authGrade).map(l => (
                                                    <option key={l} value={l}>{l}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-1 flex gap-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowProfileModal(false)}
                                            className="flex-1 bg-slate-100 text-slate-600 text-xs font-semibold py-2.5 rounded-xl hover:bg-slate-200 transition">
                                            Отмена
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 bg-blue-600 text-white text-xs font-semibold py-2.5 rounded-xl hover:bg-blue-700 transition">
                                            {isAdmin() ? "Сохранить" : "Запросить"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Навигация */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200/80 px-4 py-2.5 flex justify-around z-10 shadow-sm">
                        <button 
                            onClick={() => setActiveTab('lost-found')}
                            className={`flex flex-col items-center text-xs font-semibold transition px-4 py-1 rounded-xl ${activeTab === 'lost-found' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}>
                            <span>Потеряшки</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('library')}
                            className={`flex flex-col items-center text-xs font-semibold transition px-4 py-1 rounded-xl ${activeTab === 'library' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}>
                            <span>Библиотека</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('hub')}
                            className={`flex flex-col items-center text-xs font-semibold transition px-4 py-1 rounded-xl ${activeTab === 'hub' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600'}`}>
                            <span>Лента</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
